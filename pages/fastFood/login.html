<!doctype html>
<html lang="hy">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Մուտք</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root{ --brand:#f07a20; --brand-dark:#d96510; --text:#1d2430; --muted:#6b7280; --stroke:#e8eef6; --shadow:0 12px 30px rgba(16,24,40,.10); --radius:14px; }
        body{ color:var(--text); background:#fff; }
        .topbar{ background:var(--brand); color:#fff; font-size:.95rem; }
        .main-nav{ background:var(--brand); box-shadow:0 6px 20px rgba(0,0,0,.12); }
        .brand-pill{ background:#fff; border-radius:999px; padding:.35rem .8rem; display:inline-flex; align-items:center; gap:.5rem; font-weight:900; color:#111827; }
        .brand-dot{ width:10px;height:10px;border-radius:50%; background:var(--brand); }
        .nav-link{ color:#fff !important; opacity:.92; font-weight:600; padding:.65rem .9rem !important; }
        .nav-link:hover{ opacity:1; }
        .soft-panel{ background:#fff; border:1px solid var(--stroke); border-radius:var(--radius); box-shadow:var(--shadow); }
        .panel-title{ font-weight:900; font-size:.95rem; padding:.9rem 1rem; border-bottom:1px solid var(--stroke); }
        .btn-brand{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:900; border-radius:12px; }
        .btn-brand:hover{ background:var(--brand-dark); border-color:var(--brand-dark); color:#fff; }
        .muted{ color:var(--muted); }
        footer{ background:#0b1220; color:#cbd5e1; margin-top:30px; }
        footer a{ color:#cbd5e1; text-decoration:none; } footer a:hover{ text-decoration:underline; }
    </style>
</head>
<body>

<div class="topbar py-1">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
        <div class="d-flex gap-3 flex-wrap"><span>📞 010-xx-xx-xx</span><span>🕘 10:00 – 23:00</span></div>
        <div class="d-flex gap-3"><a class="text-white text-decoration-none" href="login.html">Մուտք</a><a class="text-white text-decoration-none" href="register.html">Գրանցում</a></div>
    </div>
</div>

<nav class="navbar navbar-expand-lg main-nav py-2">
    <div class="container">
        <a class="navbar-brand" href="#"><span class="brand-pill"><span class="brand-dot"></span> FOOD.AM</span></a>
        <button class="navbar-toggler text-white border-white" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Գլխավոր</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Ռեստորաններ</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Ակցիաներ</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="soft-panel">
                    <div class="panel-title">Մուտք</div>
                    <div class="p-3 p-md-4">
                        <div id="msg"></div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Էլ․ փոստ</label>
                            <input id="email" type="email" class="form-control" placeholder="name@mail.com">
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Գաղտնաբառ</label>
                            <input id="password" type="password" class="form-control" placeholder="••••••••">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Հիշել ինձ</label>
                            </div>
                            <a href="forgot.html" class="fw-bold text-decoration-none">Մոռացել եմ գաղտնաբառը</a>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="loginBtn" class="btn btn-brand btn-lg">Մուտք</button>
                            <a class="btn btn-outline-secondary fw-bold" href="register.html">Չունե՞ս հաշիվ — գրանցվել</a>
                        </div>

                        <hr class="my-3">
                        <div class="muted small">
                            Demo․ գրանցվիր register.html-ում, հետո login արա։ (localStorage)
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="pt-4 pb-3">
    <div class="container">
        <div class="d-flex justify-content-between flex-wrap gap-2 small" style="opacity:.85">
            <span>© 2025 FOOD.AM</span>
            <span>Auth demo</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const USERS_KEY="food_users_v1";
    const SESSION_KEY="food_session_v1";

    const $msg=document.getElementById("msg");
    const $email=document.getElementById("email");
    const $pass=document.getElementById("password");
    const $remember=document.getElementById("remember");
    const $btn=document.getElementById("loginBtn");

    function readUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY))||[] }catch{ return [] } }
    function writeSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
    function show(type,text){ $msg.innerHTML=`<div class="alert alert-${type} py-2">${text}</div>`; }

    $btn.addEventListener("click", ()=>{
        const email=($email.value||"").trim().toLowerCase();
        const password=$pass.value||"";
        if(!email || !password){ show("danger","Լրացրու email և գաղտնաբառ"); return; }

        const users=readUsers();
        const u=users.find(x=>x.email===email);
        if(!u){ show("danger","Այս email-ով օգտատեր չկա"); return; }
        if(u.password!==password){ show("danger","Սխալ գաղտնաբառ"); return; }

        writeSession({ email, createdAt: Date.now(), remember: $remember.checked });
        show("success","Մուտքը հաջող է ✅ (session saved) — հիմա կարող ես redirect անել գլխավոր էջ");
    });
</script>
</body>
</html>
