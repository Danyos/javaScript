<!doctype html>
<html lang="hy">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Գրանցում</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{ --brand:#f07a20; --brand-dark:#d96510; --text:#1d2430; --muted:#6b7280; --stroke:#e8eef6; --shadow:0 12px 30px rgba(16,24,40,.10); --radius:14px; }
        body{ color:var(--text); background:#fff; }
        .topbar{ background:var(--brand); color:#fff; font-size:.95rem; }
        .main-nav{ background:var(--brand); box-shadow:0 6px 20px rgba(0,0,0,.12); }
        .brand-pill{ background:#fff; border-radius:999px; padding:.35rem .8rem; display:inline-flex; align-items:center; gap:.5rem; font-weight:900; color:#111827; }
        .brand-dot{ width:10px;height:10px;border-radius:50%; background:var(--brand); }
        .soft-panel{ background:#fff; border:1px solid var(--stroke); border-radius:var(--radius); box-shadow:var(--shadow); }
        .panel-title{ font-weight:900; font-size:.95rem; padding:.9rem 1rem; border-bottom:1px solid var(--stroke); }
        .btn-brand{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:900; border-radius:12px; }
        .btn-brand:hover{ background:var(--brand-dark); border-color:var(--brand-dark); color:#fff; }
        .muted{ color:var(--muted); }
        footer{ background:#0b1220; color:#cbd5e1; margin-top:30px; }
    </style>
</head>
<body>

<div class="topbar py-1">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
        <div class="d-flex gap-3 flex-wrap"><span>📞 010-xx-xx-xx</span><span>🕘 10:00 – 23:00</span></div>
        <div class="d-flex gap-3">
            <a class="text-white text-decoration-none" href="login.html">Մուտք</a>
            <a class="text-white text-decoration-none" href="register.html">Գրանցում</a>
        </div>
    </div>
</div>

<nav class="navbar main-nav py-2">
    <div class="container">
        <a class="navbar-brand" href="#"><span class="brand-pill"><span class="brand-dot"></span> FOOD.AM</span></a>
    </div>
</nav>

<section class="py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">
                <div class="soft-panel">
                    <div class="panel-title">Գրանցում</div>
                    <div class="p-3 p-md-4">
                        <div id="msg"></div>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold">Անուն</label>
                                <input id="name" class="form-control" placeholder="օր. Daniel">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold">Հեռախոս (optional)</label>
                                <input id="phone" class="form-control" placeholder="+374...">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Էլ․ փոստ</label>
                                <input id="email" type="email" class="form-control" placeholder="name@mail.com">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold">Գաղտնաբառ</label>
                                <input id="password" type="password" class="form-control" placeholder="min 6">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold">Կրկնել գաղտնաբառը</label>
                                <input id="password2" type="password" class="form-control" placeholder="repeat">
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="agree">
                                    <label class="form-check-label" for="agree">Համաձայն եմ պայմաններին</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-3">
                            <button id="regBtn" class="btn btn-brand btn-lg">Գրանցվել</button>
                            <a class="btn btn-outline-secondary fw-bold" href="login.html">Արդեն ունե՞ս հաշիվ — մուտք</a>
                        </div>

                        <hr class="my-3">
                        <div class="muted small">Demo․ տվյալները պահվում են localStorage-ում։</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="pt-4 pb-3">
    <div class="container">
        <div class="d-flex justify-content-between flex-wrap gap-2 small" style="opacity:.85">
            <span>© 2025 FOOD.AM</span>
            <span>Register demo</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const USERS_KEY="food_users_v1";
    const $msg=document.getElementById("msg");

    function readUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY))||[] }catch{ return [] } }
    function writeUsers(users){ localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
    function show(type,text){ $msg.innerHTML=`<div class="alert alert-${type} py-2">${text}</div>`; }

    document.getElementById("regBtn").addEventListener("click", ()=>{
        const name=document.getElementById("name").value.trim();
        const phone=document.getElementById("phone").value.trim();
        const email=(document.getElementById("email").value||"").trim().toLowerCase();
        const p1=document.getElementById("password").value||"";
        const p2=document.getElementById("password2").value||"";
        const agree=document.getElementById("agree").checked;

        if(!name || !email || !p1 || !p2){ show("danger","Լրացրու պարտադիր դաշտերը"); return; }
        if(p1.length < 6){ show("danger","Գաղտնաբառը պետք է լինի առնվազն 6 նշան"); return; }
        if(p1 !== p2){ show("danger","Գաղտնաբառերը չեն համընկնում"); return; }
        if(!agree){ show("danger","Պետք է համաձայնել պայմաններին"); return; }

        const users=readUsers();
        if(users.some(u=>u.email===email)){ show("danger","Այս email-ով արդեն գրանցված է"); return; }

        users.push({ id: Date.now(), name, phone, email, password: p1, createdAt: Date.now() });
        writeUsers(users);

        show("success","Գրանցումը հաջող է ✅ հիմա կարող ես login անել");
        setTimeout(()=> location.href="login.html", 800);
    });
</script>
</body>
</html>
