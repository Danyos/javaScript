<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Պարզ Mobile Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        :root{
            --bg-main:#f5f5f7;
            --bg-card:#ffffff;
            --border-soft:#e2e2e8;
            --text-main:#111827;
            --text-muted:#6b7280;
            --accent:#0d6efd;
        }
        *{
            box-sizing:border-box;
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        body{
            background:var(--bg-main);
            color:var(--text-main);
        }
        .sidebar{
            background:#ffffff;
            border-right:1px solid var(--border-soft);
            min-height:100vh;
        }
        .product-card{
            background:var(--bg-card);
            border:1px solid var(--border-soft);
            border-radius:12px;
            padding:10px;
            display:flex;
            flex-direction:column;
            height:100%;
        }
        .product-image{
            background:#f9fafb;
            border:1px solid #e5e7eb;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            height:180px;
            margin-bottom:8px;
        }
        .product-image img{
            max-height:170px;
            width:auto;
        }
        .product-name{
            font-size:.95rem;
            font-weight:600;
        }
        .product-price{
            font-weight:600;
            margin-top:4px;
        }
        .text-muted-2{
            color:var(--text-muted);
            font-size:.85rem;
        }
        .cart-bar{
            background:#ffffff;
            border:1px solid var(--border-soft);
            border-radius:12px;
            padding:10px 14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin:16px 0;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- LEFT: FILTERS -->
        <aside class="col-12 col-md-3 sidebar p-3">
            <h5 class="mb-3">Ֆիլտրեր</h5>

            <div class="mb-3">
                <label for="categoryFilter" class="form-label text-muted-2">Կատեգորիա</label>
                <select id="categoryFilter" class="form-select">
                    <option value="">Բոլորը</option>
                </select>
            </div>

            <button id="resetFilters" class="btn btn-outline-secondary btn-sm">
                Մաքրել ֆիլտրերը
            </button>
        </aside>

        <!-- RIGHT: PRODUCTS + CART -->
        <main class="col-12 col-md-9 p-3">

            <!-- CART BAR -->
            <div class="cart-bar">
                <div>
                    <div class="text-muted-2">Զամբյուղ</div>
                    <div>
                        <span id="cartCount">0</span> ապրանք •
                        <strong><span id="cartTotal">0</span> ֏</strong>
                    </div>
                </div>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#cartModal">
                    Տեսնել զամբյուղը
                </button>
            </div>

            <!-- PRODUCTS TITLE -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0 text-muted-2 text-uppercase">Ապրանքներ</h6>
                <span class="text-muted-2">
          Ցույց է տրված՝ <span id="visibleCount">0</span> / <span id="totalCount">0</span>
        </span>
            </div>

            <!-- PRODUCTS GRID -->
            <div id="productsContainer" class="row g-3">
                <!-- JS will render here -->
            </div>

        </main>
    </div>
</div>

<!-- CART MODAL -->
<div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Զամբյուղ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Փակել"></button>
            </div>
            <div class="modal-body">
                <div id="cartItems"></div>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <div>
                    Ընդհանուր՝ <strong><span id="cartTotalModal">0</span> ֏</strong>
                </div>
                <button class="btn btn-success btn-sm">
                    Checkout
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- DATA (պարզ տարբերակ) ---
    const categories = [
        { id: 1, name: "Հեռախոսներ" },
        { id: 2, name: "Պլանշետներ" }
    ];

    const products = [
        {
            id: 1,
            categoryId: 1,
            name: "iPhone 17",
            price: 499000,
            image: "https://placehold.co/350x500?text=iPhone%2017"
        },
        {
            id: 2,
            categoryId: 1,
            name: "Samsung Galaxy S26",
            price: 449000,
            image: "https://placehold.co/350x500?text=Galaxy%20S26"
        },
        {
            id: 3,
            categoryId: 1,
            name: "Xiaomi Redmi Note 14",
            price: 219000,
            image: "https://placehold.co/350x500?text=Redmi%20Note%2014"
        },
        {
            id: 4,
            categoryId: 2,
            name: "iPad Air 7",
            price: 379000,
            image: "https://placehold.co/350x500?text=iPad%20Air%207"
        },
        {
            id: 5,
            categoryId: 2,
            name: "Samsung Galaxy Tab S11",
            price: 329000,
            image: "https://placehold.co/350x500?text=Tab%20S11"
        }
    ];

    // --- HELPERS ---
    function formatPrice(n){
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
    }

    // --- CART STATE ---
    // cart = [{ productId, qty }]
    const cart = [];

    function addToCart(productId){
        const item = cart.find(i => i.productId === productId);
        if(item){
            item.qty++;
        }else{
            cart.push({ productId, qty: 1 });
        }
        updateCartUI();
    }

    function changeQty(productId, delta){
        const item = cart.find(i => i.productId === productId);
        if(!item) return;
        item.qty += delta;
        if(item.qty <= 0){
            const index = cart.indexOf(item);
            cart.splice(index,1);
        }
        updateCartUI();
    }

    function removeFromCart(productId){
        const index = cart.findIndex(i => i.productId === productId);
        if(index > -1){
            cart.splice(index,1);
        }
        updateCartUI();
    }

    function getCartTotal(){
        return cart.reduce((sum, item) => {
            const p = products.find(x => x.id === item.productId);
            return sum + (p.price * item.qty);
        }, 0);
    }

    function getCartCount(){
        return cart.reduce((sum, item) => sum + item.qty, 0);
    }

    // --- FILTER STATE ---
    let selectedCategoryId = "";

    // --- RENDER FILTER OPTIONS ---
    function renderCategoryFilter(){
        const sel = document.getElementById("categoryFilter");
        categories.forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat.id;
            opt.textContent = cat.name;
            sel.appendChild(opt);
        });
    }

    // --- RENDER PRODUCTS ---
    function renderProducts(){
        const container = document.getElementById("productsContainer");
        container.innerHTML = "";

        const filtered = products.filter(p => {
            if(selectedCategoryId && p.categoryId !== Number(selectedCategoryId)) return false;
            return true;
        });

        document.getElementById("totalCount").textContent = products.length;
        document.getElementById("visibleCount").textContent = filtered.length;

        if(!filtered.length){
            container.innerHTML = "<p class='text-muted-2'>Ապրանք չի գտնվել։</p>";
            return;
        }

        filtered.forEach(p => {
            const col = document.createElement("div");
            col.className = "col-12 col-sm-6 col-md-4";

            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
        <div>
          <div class="product-image">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">${formatPrice(p.price)} ֏</div>
        </div>
        <button class="btn btn-primary btn-sm mt-2">
          Ավելացնել զամբյուղում
        </button>
      `;

            card.querySelector("button").addEventListener("click", () => {
                addToCart(p.id);
            });

            col.appendChild(card);
            container.appendChild(col);
        });
    }

    // --- RENDER CART UI ---
    function updateCartUI(){
        const count = getCartCount();
        const total = getCartTotal();

        // small cart bar
        document.getElementById("cartCount").textContent = count;
        document.getElementById("cartTotal").textContent = formatPrice(total);

        // modal cart
        const cartItemsDiv = document.getElementById("cartItems");
        cartItemsDiv.innerHTML = "";

        if(!cart.length){
            cartItemsDiv.innerHTML = "<p class='text-muted-2 mb-0'>Զամբյուղը դատարկ է։</p>";
        }else{
            cart.forEach(item => {
                const p = products.find(x => x.id === item.productId);
                const row = document.createElement("div");
                row.className = "d-flex justify-content-between align-items-center mb-2 border-bottom pb-2";

                row.innerHTML = `
          <div>
            <div>${p.name}</div>
            <div class="text-muted-2">${formatPrice(p.price)} ֏ × ${item.qty}</div>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-sm btn-outline-secondary minus">-</button>
            <span>${item.qty}</span>
            <button class="btn btn-sm btn-outline-secondary plus">+</button>
            <button class="btn btn-sm btn-outline-danger remove">&times;</button>
          </div>
        `;

                row.querySelector(".plus").addEventListener("click", () => changeQty(p.id, +1));
                row.querySelector(".minus").addEventListener("click", () => changeQty(p.id, -1));
                row.querySelector(".remove").addEventListener("click", () => removeFromCart(p.id));

                cartItemsDiv.appendChild(row);
            });
        }

        document.getElementById("cartTotalModal").textContent = formatPrice(total);
    }

    // --- EVENTS ---
    document.getElementById("categoryFilter").addEventListener("change", (e) => {
        selectedCategoryId = e.target.value;
        renderProducts();
    });

    document.getElementById("resetFilters").addEventListener("click", () => {
        selectedCategoryId = "";
        document.getElementById("categoryFilter").value = "";
        renderProducts();
    });

    // --- INIT ---
    renderCategoryFilter();
    renderProducts();
    updateCartUI();
</script>
</body>
</html>
