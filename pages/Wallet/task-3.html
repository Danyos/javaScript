<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Իմ Քարտը • Պարզ համակարգ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background: #f3f4f6;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .app-card {
            max-width: 900px;
            margin: 30px auto;
        }
        .card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }
        .balance {
            font-size: 2.4rem;
            font-weight: 700;
        }
        .history-wrap {
            max-height: 360px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div class="container app-card">
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h4 class="mb-1">Իմ Քարտը</h4>
                    <p class="text-muted mb-0 small">Պարզ համակարգ՝ լիցքավորում, փոխանցում, վճարում և պատմություն 💳</p>
                </div>
            </div>

            <hr>

            <!-- Balance -->
            <div class="row g-4">
                <div class="col-md-4">
                    <h6 class="text-muted small mb-1">Քարտի մնացորդ</h6>
                    <div id="card-balance" class="balance mb-2">0 ֏</div>
                    <p class="text-muted small mb-2">
                        Սկզբնական մնացորդը՝ <strong>0 ֏</strong>։ Կարող ես լիցքավորել ու փորձել գործողությունները։
                    </p>
                    <small id="message" class="text-muted small"></small>
                </div>

                <!-- Actions -->
                <div class="col-md-8">
                    <div class="row g-3">
                        <!-- Top-up -->
                        <div class="col-12">
                            <div class="border rounded-3 p-3 bg-light">
                                <h6 class="small text-uppercase text-muted mb-2">Լիցքավորում քարտի վրա</h6>
                                <div class="row g-2 align-items-end">
                                    <div class="col-sm-5">
                                        <label class="form-label small" for="topup-amount">Գումար</label>
                                        <input type="number" id="topup-amount" class="form-control" min="1"
                                               placeholder="Օր. 20000">
                                    </div>
                                    <div class="col-sm-5">
                                        <label class="form-label small" for="topup-note">Նշում (կամ որտեղից)</label>
                                        <input type="text" id="topup-note" class="form-control"
                                               placeholder="Օր. Քեշ, աշխատավարձ ...">
                                    </div>
                                    <div class="col-sm-2 d-grid">
                                        <button id="btn-topup" class="btn btn-success">
                                            Լիցքավորել
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Transfer -->
                        <div class="col-12">
                            <div class="border rounded-3 p-3 bg-light">
                                <h6 class="small text-uppercase text-muted mb-2">Փոխանցում ուրիշին</h6>
                                <div class="row g-2 align-items-end">
                                    <div class="col-sm-5">
                                        <label class="form-label small" for="transfer-amount">Գումար</label>
                                        <input type="number" id="transfer-amount" class="form-control" min="1"
                                               placeholder="Օր. 10000">
                                    </div>
                                    <div class="col-sm-5">
                                        <label class="form-label small" for="transfer-to">Ում (անուն կամ քարտ)</label>
                                        <input type="text" id="transfer-to" class="form-control"
                                               placeholder="Օր. Արմեն, 4444 **** **** 1234">
                                    </div>
                                    <div class="col-sm-2 d-grid">
                                        <button id="btn-transfer" class="btn btn-outline-primary">
                                            Փոխանցել
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Payment -->
                        <div class="col-12">
                            <div class="border rounded-3 p-3 bg-light">
                                <h6 class="small text-uppercase text-muted mb-2">Վճարում ծառայությունների համար</h6>
                                <div class="row g-2 align-items-end">
                                    <div class="col-sm-4">
                                        <label class="form-label small" for="payment-amount">Գումար</label>
                                        <input type="number" id="payment-amount" class="form-control" min="1"
                                               placeholder="Օր. 8000">
                                    </div>
                                    <div class="col-sm-5">
                                        <label class="form-label small" for="service-select">Ծառայություն</label>
                                        <select id="service-select" class="form-select">
                                            <option value="Ինտերնետ">Ինտերնետ</option>
                                            <option value="Կոմունալ վճարներ">Կոմունալ վճարներ</option>
                                            <option value="Խանութ">Խանութ</option>
                                            <option value="Բջջային">Բջջային</option>
                                            <option value="Այլ ծառայություն">Այլ ծառայություն</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-3 d-grid">
                                        <button id="btn-pay" class="btn btn-outline-danger">
                                            Վճարել
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div><!-- row g-3 -->
                </div><!-- col-md-8 -->
            </div><!-- row g-4 -->

            <hr class="my-4">

            <!-- History -->
            <div class="row">
                <div class="col-12 d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">Պատմություն</h6>
                    <button id="btn-clear-history" class="btn btn-sm btn-link text-decoration-none">
                        Մաքրել պատմությունը
                    </button>
                </div>
                <div class="col-12">
                    <div class="history-wrap">
                        <ul id="history-list" class="list-group list-group-flush small">
                            <li class="list-group-item text-muted">
                                Դեռ ոչ մի գործողություն չի կատարվել։
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

        </div><!-- card-body -->
    </div><!-- card -->
</div><!-- container -->

<script>
    const card={balance:0};let history=[];const balanceEl=document.getElementById("card-balance"),messageEl=document.getElementById("message"),historyListEl=document.getElementById("history-list"),topupAmountEl=document.getElementById("topup-amount"),topupNoteEl=document.getElementById("topup-note"),transferAmountEl=document.getElementById("transfer-amount"),transferToEl=document.getElementById("transfer-to"),paymentAmountEl=document.getElementById("payment-amount"),serviceSelectEl=document.getElementById("service-select"),btnTopup=document.getElementById("btn-topup"),btnTransfer=document.getElementById("btn-transfer"),btnPay=document.getElementById("btn-pay"),btnClearHistory=document.getElementById("btn-clear-history");function formatAmount(e){return e.toLocaleString("hy-AM")+" ֏"}function showBalance(){balanceEl.textContent=formatAmount(card.balance)}function showMessage(e,t="muted"){messageEl.textContent=e,messageEl.className="small text-"+t}function addHistory(e,t,n){const s={type:e,text:t,change:n,time:(new Date).toLocaleString("hy-AM")};history.push(s),renderHistory()}function renderHistory(){if(historyListEl.innerHTML="",0===history.length){const e=document.createElement("li");return e.className="list-group-item text-muted",e.textContent="Դեռ ոչ մի գործողություն չի կատարվել։",void historyListEl.appendChild(e)}history.slice().reverse().forEach((e=>{const t=document.createElement("li");t.className="list-group-item",t.innerHTML=`\n        <div class="d-flex justify-content-between">\n          <div>\n            <strong>${e.type}</strong> • ${e.text}\n          </div>\n          <span>${e.change>0?"+":""}${formatAmount(e.change)}</span>\n        </div>\n        <div class="text-muted small">${e.time}</div>\n      `,historyListEl.appendChild(t)}))}btnTopup.addEventListener("click",(()=>{const e=Number(topupAmountEl.value),t=topupNoteEl.value.trim();if(!e||e<=0)return void showMessage("Լիցքավորման գումարը պետք է լինի դրական թիվ։","danger");card.balance+=e,showBalance();addHistory("Լիցքավորում",t?`Լիցքավորում աղբյուրից՝ «${t}»`:"Լիցքավորում քարտի վրա",e),showMessage("Քարտը հաջողությամբ լիցքավորվեց։","success"),topupAmountEl.value="",topupNoteEl.value=""})),btnTransfer.addEventListener("click",(()=>{const e=Number(transferAmountEl.value),t=transferToEl.value.trim()||"անհայտ ստացող";if(!e||e<=0)return void showMessage("Փոխանցման գումարը պետք է լինի դրական թիվ։","danger");if(card.balance<e)return void showMessage("Քարտի վրա բավարար գումար չկա փոխանցման համար։","danger");card.balance-=e,showBalance();addHistory("Փոխանցում",`Փոխանցում ստացողին՝ «${t}»`,-e),showMessage("Փոխանցումը կատարվեց։","success"),transferAmountEl.value="",transferToEl.value=""})),btnPay.addEventListener("click",(()=>{const e=Number(paymentAmountEl.value),t=serviceSelectEl.value;if(!e||e<=0)return void showMessage("Վճարման գումարը պետք է լինի դրական թիվ։","danger");if(card.balance<e)return void showMessage("Քարտի վրա բավարար գումար չկա վճարման համար։","danger");card.balance-=e,showBalance();addHistory("Վճարում",`Վճարում ծառայությանը՝ «${t}»`,-e),showMessage("Վճարումը հաջողությամբ կատարվեց։","success"),paymentAmountEl.value=""})),btnClearHistory.addEventListener("click",(()=>{history=[],renderHistory(),showMessage("Պատմությունը մաքրվեց։","muted")})),showBalance(),renderHistory(),showMessage("Սկսի լիցքավորումից, հետո փորձիր փոխանցում ու վճարում 😊");
</script>
</body>
</html>
