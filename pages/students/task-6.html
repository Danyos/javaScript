<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Simple Product Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #020617;
            --card: #020617;
            --border: #1f2937;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.14);
            --danger: #f97373;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b, #020617 55%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.96);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
            padding: 18px 16px 20px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .app-header h1 {
            font-size: 20px;
            margin: 0;
        }

        .app-header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.55);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) 260px;
            gap: 14px;
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(15, 23, 42, 0.98);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 10px 10px 12px;
        }

        .card-title {
            font-size: 14px;
            margin: 0 0 8px;
            font-weight: 500;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 0 8px;
        }

        /* CATEGORY FILTERS */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .filter-btn {
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text-muted);
            font-size: 11px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .filter-btn.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: #e0f2fe;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 6px 7px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 11px;
            background: rgba(15, 23, 42, 0.98);
        }

        tbody tr:nth-child(2n) {
            background: rgba(15, 23, 42, 0.8);
        }

        tbody tr:hover {
            background: rgba(15, 23, 42, 0.95);
        }

        .empty-state {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 10px 0 4px;
        }

        /* FORM */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        label {
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        select {
            padding: 7px 9px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.5);
        }

        .btn {
            border-radius: 999px;
            border: none;
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
            color: #020617;
            font-weight: 500;
            width: 100%;
            margin-top: 4px;
        }

        .btn:active {
            transform: translateY(1px) scale(.99);
        }

        .error-text {
            font-size: 11px;
            color: var(--danger);
            min-height: 14px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="app">
    <header class="app-header">
        <div>
            <h1>Simple Product Inventory</h1>
            <p>categories + products բազաներ, կապ՝ categoryId 👇</p>
        </div>
        <div class="badge">Arrays • Relations • DOM</div>
    </header>

    <div class="layout">
        <!-- LEFT: PRODUCTS TABLE -->
        <section class="card">
            <h2 class="card-title">Ապրանքների ցուցակ</h2>
            <p class="card-subtitle">Ընտրիր կատեգորիա՝ ապրանքները ֆիլտրելու համար</p>

            <div id="filters" class="filters">
                <!-- category buttons from JS -->
            </div>

            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Ապրանքի անուն</th>
                    <th>Կատեգորիա</th>
                    <th>Գին (֏)</th>
                </tr>
                </thead>
                <tbody id="products-body">
                <!-- rows from JS -->
                </tbody>
            </table>

            <div id="empty-state" class="empty-state" style="display: none;">
                Այս կատեգորիայում դեռ ապրանք չկա 🙂
            </div>
        </section>

        <!-- RIGHT: ADD PRODUCT FORM -->
        <section class="card">
            <h2 class="card-title">Ավելացրու նոր ապրանք</h2>
            <p class="card-subtitle">Ապրանքի անուն + գին + կատեգորիա</p>

            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Ապրանքի անուն</label>
                    <input
                            type="text"
                            id="product-name"
                            placeholder="Օրինակ՝ MacBook Pro"
                    >
                </div>

                <div class="form-group">
                    <label for="product-price">Գին (֏)</label>
                    <input
                            type="number"
                            id="product-price"
                            min="0"
                            placeholder="Օրինակ՝ 450000"
                    >
                </div>

                <div class="form-group">
                    <label for="product-category">Կատեգորիա</label>
                    <select id="product-category">
                        <!-- options from JS -->
                    </select>
                </div>

                <button type="submit" class="btn">+ Ավելացնել ապրանք</button>
                <div id="error" class="error-text"></div>
            </form>
        </section>
    </div>
</div>

<script>
    // --- ԲԱԶԱՆԵՐ ---
    const categories = [
        { id: 1, name: "Laptop" },
        { id: 2, name: "Phone" },
        { id: 3, name: "Accessory" }
    ];

    const products = [
        { id: 1, name: "MacBook Air", price: 350000, categoryId: 1 },
        { id: 2, name: "iPhone 13", price: 280000, categoryId: 2 },
        { id: 3, name: "USB-C Cable", price: 8000, categoryId: 3 },
        { id: 4, name: "Lenovo Laptop", price: 220000, categoryId: 1 }
    ];

    // --- STATE ---
    let currentCategoryId = "all"; // "all" or number

    // --- DOM ---
    const filtersEl = document.getElementById("filters");
    const productsBodyEl = document.getElementById("products-body");
    const emptyStateEl = document.getElementById("empty-state");

    const productForm = document.getElementById("product-form");
    const productNameInput = document.getElementById("product-name");
    const productPriceInput = document.getElementById("product-price");
    const productCategorySelect = document.getElementById("product-category");
    const errorEl = document.getElementById("error");

    // --- HELPERS ---
    function formatPrice(value) {
        return value.toLocaleString("hy-AM");
    }

    function getCategoryNameById(id) {
        const cat = categories.find(c => c.id === id);
        return cat ? cat.name : "Անհայտ";
    }

    // --- RENDER CATEGORY FILTER BUTTONS ---
    function renderFilters() {
        filtersEl.innerHTML = "";

        // "Բոլորը" կոճակ
        const allBtn = document.createElement("button");
        allBtn.textContent = "Բոլորը";
        allBtn.className = "filter-btn";
        if (currentCategoryId === "all") {
            allBtn.classList.add("active");
        }
        allBtn.addEventListener("click", () => {
            currentCategoryId = "all";
            renderFilters();
            renderProducts();
        });
        filtersEl.appendChild(allBtn);

        // Մնացած կատեգորիաներ
        categories.forEach(cat => {
            const btn = document.createElement("button");
            btn.textContent = cat.name;
            btn.className = "filter-btn";
            if (currentCategoryId === cat.id) {
                btn.classList.add("active");
            }
            btn.addEventListener("click", () => {
                currentCategoryId = cat.id;
                renderFilters();
                renderProducts();
            });
            filtersEl.appendChild(btn);
        });
    }

    // --- RENDER PRODUCTS TABLE ---
    function renderProducts() {
        productsBodyEl.innerHTML = "";

        let list = products;

        if (currentCategoryId !== "all") {
            list = list.filter(p => p.categoryId === currentCategoryId);
        }

        if (list.length === 0) {
            emptyStateEl.style.display = "block";
            return;
        }

        emptyStateEl.style.display = "none";

        list.forEach((product, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${product.name}</td>
        <td>${getCategoryNameById(product.categoryId)}</td>
        <td>${formatPrice(product.price)}</td>
      `;
            productsBodyEl.appendChild(tr);
        });
    }

    // --- FILL CATEGORY SELECT (FORM) ---
    function fillCategorySelect() {
        productCategorySelect.innerHTML = "";
        categories.forEach(cat => {
            const option = document.createElement("option");
            option.value = cat.id;
            option.textContent = cat.name;
            productCategorySelect.appendChild(option);
        });
    }

    function showError(message) {
        errorEl.textContent = message;
    }

    function clearError() {
        errorEl.textContent = "";
    }

    // --- FORM SUBMIT ---
    productForm.addEventListener("submit", function (e) {
        e.preventDefault();
        clearError();

        const name = productNameInput.value.trim();
        const priceValue = productPriceInput.value;
        const categoryId = Number(productCategorySelect.value);

        if (!name) {
            showError("Գրի՛ր ապրանքի անունը։");
            return;
        }

        if (priceValue === "") {
            showError("Գրի՛ր գինը։");
            return;
        }

        const price = Number(priceValue);
        if (Number.isNaN(price) || price < 0) {
            showError("Գինը պետք է դրական թիվ լինի։");
            return;
        }

        const newProduct = {
            id: Date.now(),
            name,
            price,
            categoryId
        };

        products.push(newProduct);

        productForm.reset();
        productNameInput.focus();

        // Թարմացնենք աղյուսակը
        renderProducts();
    });

    // --- INITIAL RENDER ---
    fillCategorySelect();
    renderFilters();
    renderProducts();
</script>

</body>
</html>
