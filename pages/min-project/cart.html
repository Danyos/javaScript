<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Զամբյուղ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
    <style>
        :root{
            --bg-main:#f5f5f7;
            --bg-card:#ffffff;
            --border-soft:#e2e2e8;
            --text-main:#111827;
            --text-muted:#6b7280;
            --accent:#0d6efd;
        }
        *{
            box-sizing:border-box;
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        body{
            background:var(--bg-main);
            color:var(--text-main);
            min-height:100vh;
        }
        .page-shell{
            max-width:1100px;
            margin:0 auto;
            padding:20px 16px 40px;
        }
        .cart-card{
            background:var(--bg-card);
            border-radius:20px;
            border:1px solid var(--border-soft);
            padding:20px;
        }
        .text-muted-2{
            color:var(--text-muted);
            font-size:.85rem;
        }
        .qty-btn{
            min-width:32px;
        }
    </style>
</head>
<body>
<div class="page-shell">
    <header class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <a href="index.html" class="btn btn-sm btn-outline-secondary">← Շարունակել գնումները</a>
            <span class="text-muted-2">Զամբյուղ</span>
        </div>
    </header>

    <div class="cart-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="mb-0">Ձեր զամբյուղը</h4>
                <p class="text-muted-2 mb-0">
                    Ընդամենը <span id="cartItemsCount">0</span> ապրանք
                </p>
            </div>
            <div class="text-end">
                <div class="fw-semibold">
                    Ընդհանուր՝ <span id="cartTotal">0</span> ֏
                </div>
                <button id="clearCartBtn" class="btn btn-sm btn-outline-danger mt-1">
                    Մաքրել զամբյուղը
                </button>
            </div>
        </div>

        <div id="cartContent"></div>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
            <div class="text-muted-2" id="cartSummaryLine"></div>
            <button id="checkoutBtn" class="btn btn-success px-4">
                Checkout
            </button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
    function renderCartPage() {
        const cart = loadCart();
        const count = getCartItemsCount(cart);
        const total = getCartTotal(cart);

        document.getElementById("cartItemsCount").textContent = count;
        document.getElementById("cartTotal").textContent = formatPrice(total);

        const container = document.getElementById("cartContent");
        const summaryLine = document.getElementById("cartSummaryLine");
        container.innerHTML = "";

        if (!count) {
            container.innerHTML = "<p class='text-muted-2 mb-0'>Ձեր զամբյուղը դատարկ է։</p>";
            summaryLine.textContent = "";
            return;
        }

        const list = document.createElement("div");
        list.className = "list-group";

        cart.forEach(item => {
            const p = products.find(pr => pr.id === item.productId);
            if (!p) return;
            const brand = getBrand(p.brandId);
            const finalPrice = getFinalPrice(p);

            const row = document.createElement("div");
            row.className = "list-group-item border-0 border-bottom d-flex justify-content-between align-items-center";

            row.innerHTML = `
        <div class="d-flex align-items-center gap-3">
          <img src="${p.image}" alt="${p.name}" style="width:60px;height:auto;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;">
          <div>
            <div class="fw-semibold">${p.name}</div>
            <div class="text-muted-2">${brand ? brand.name : ""}</div>
          </div>
        </div>
        <div class="text-end">
          <div class="fw-semibold mb-1">${formatPrice(finalPrice * item.qty)} ֏</div>
          <div class="d-flex align-items-center justify-content-end gap-1 mb-1">
            <button class="btn btn-sm btn-outline-secondary qty-btn minus-btn">-</button>
            <span class="px-2 text-muted">${item.qty}</span>
            <button class="btn btn-sm btn-outline-secondary qty-btn plus-btn">+</button>
            <button class="btn btn-sm btn-outline-danger ms-1 remove-btn">&times;</button>
          </div>
          <small class="text-muted-2 d-block">1 հատ — ${formatPrice(finalPrice)} ֏</small>
        </div>
      `;

            row.querySelector(".plus-btn").addEventListener("click", () => {
                const c = loadCart();
                const it = c.find(i => i.productId === p.id);
                if (it) {
                    it.qty += 1;
                    saveCart(c);
                    renderCartPage();
                }
            });

            row.querySelector(".minus-btn").addEventListener("click", () => {
                const c = loadCart();
                const it = c.find(i => i.productId === p.id);
                if (it) {
                    it.qty -= 1;
                    if (it.qty <= 0) {
                        const idx = c.indexOf(it);
                        if (idx > -1) c.splice(idx, 1);
                    }
                    saveCart(c);
                    renderCartPage();
                }
            });

            row.querySelector(".remove-btn").addEventListener("click", () => {
                const c = loadCart();
                const idx = c.findIndex(i => i.productId === p.id);
                if (idx > -1) {
                    c.splice(idx, 1);
                    saveCart(c);
                    renderCartPage();
                }
            });

            list.appendChild(row);
        });

        container.appendChild(list);
        summaryLine.textContent = `Ընդամենը ${count} ապրանք • ${formatPrice(total)} ֏`;
    }

    document.getElementById("clearCartBtn").addEventListener("click", () => {
        saveCart([]);
        renderCartPage();
    });

    document.getElementById("checkoutBtn").addEventListener("click", () => {
        alert("Այս հատվածում հետո կարող ես կապել վճարման համակարգին կամ պատվերի ձևին 🙂");
    });

    renderCartPage();
</script>
</body>
</html>
