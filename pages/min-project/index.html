<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Mobile Store — Ապրանքներ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        :root{
            --bg-main:#f5f5f7;
            --bg-sidebar:#ffffff;
            --bg-card:#ffffff;
            --border-soft:#e2e2e8;
            --text-main:#111827;
            --text-muted:#6b7280;
            --accent:#0d6efd;
        }
        *{
            box-sizing:border-box;
            font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        body{
            background:var(--bg-main);
            color:var(--text-main);
            min-height:100vh;
        }
        .app-shell{
            min-height:100vh;
        }
        .sidebar{
            background:var(--bg-sidebar);
            border-right:1px solid var(--border-soft);
        }
        .sidebar h5{
            font-weight:600;
            letter-spacing:.03em;
        }
        .filter-group label{
            font-size:.85rem;
            color:var(--text-muted);
            margin-bottom:.15rem;
        }
        .filter-group .form-control,
        .filter-group .form-select{
            background-color:#f9fafb;
            border-color:var(--border-soft);
            color:var(--text-main);
            font-size:.9rem;
        }
        .filter-group .form-control::placeholder{
            color:var(--text-muted);
        }
        .filter-group .form-control:focus,
        .filter-group .form-select:focus{
            box-shadow:none;
            border-color:var(--accent);
            background-color:#ffffff;
        }
        .main-area{
            padding:20px 24px 32px;
        }
        .cart-bar{
            background:var(--bg-card);
            border-radius:16px;
            border:1px solid var(--border-soft);
            padding:14px 18px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-bottom:18px;
        }
        .cart-title{
            font-size:.9rem;
            text-transform:uppercase;
            letter-spacing:.08em;
            color:var(--text-muted);
        }
        .cart-summary-main{
            font-size:1.1rem;
            font-weight:600;
        }
        .cart-summary-sub{
            font-size:.8rem;
            color:var(--text-muted);
        }
        .product-card{
            background:var(--bg-card);
            border-radius:18px;
            border:1px solid var(--border-soft);
            padding:10px 10px 14px;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
            cursor:pointer;
        }
        .product-card:hover{
            transform:translateY(-3px);
            border-color:var(--accent);
            box-shadow:0 12px 28px rgba(15,23,42,.12);
        }
        .product-image-wrapper{
            background:#f9fafb;
            border-radius:14px;
            overflow:hidden;
            border:1px solid #e5e7eb;
            display:flex;
            align-items:center;
            justify-content:center;
            height:210px;
            margin-bottom:10px;
        }
        .product-image-wrapper img{
            max-height:200px;
            width:auto;
            display:block;
        }
        .product-name{
            font-size:.95rem;
            font-weight:600;
            margin-bottom:2px;
        }
        .product-meta{
            font-size:.8rem;
            color:var(--text-muted);
            margin-bottom:4px;
        }
        .price-row{
            display:flex;
            align-items:baseline;
            gap:6px;
            margin-top:4px;
        }
        .price-main{
            font-weight:600;
            font-size:.98rem;
        }
        .price-old{
            font-size:.75rem;
            text-decoration:line-through;
            color:var(--text-muted);
        }
        .discount-badge{
            font-size:.7rem;
            padding:2px 6px;
            border-radius:999px;
            border:1px solid rgba(16,185,129,.4);
            color:#047857;
            background-color:#d1fae5;
        }
        .product-actions{
            margin-top:10px;
            display:flex;
            justify-content:space-between;
            gap:8px;
        }
        .btn{
            border-radius:999px;
            font-size:.8rem;
            padding:6px 10px;
        }
        .btn-outline-dark{
            border-color:var(--border-soft);
            color:var(--text-main);
            background:#ffffff;
        }
        .btn-outline-dark:hover{
            background:#111827;
            color:#ffffff;
        }
        .text-muted-2{
            color:var(--text-muted);
            font-size:.78rem;
        }
        @media (max-width: 991.98px){
            .sidebar{
                border-right:none;
                border-bottom:1px solid var(--border-soft);
            }
            .main-area{
                padding:16px;
            }
        }
    </style>
</head>
<body>

<div class="container-fluid app-shell">
    <div class="row h-100">
        <!-- SIDEBAR FILTERS -->
        <aside class="col-12 col-lg-3 sidebar p-3 p-lg-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Ֆիլտրեր</h5>
                <button id="resetFiltersBtn" class="btn btn-sm btn-outline-dark">
                    Մաքրել
                </button>
            </div>

            <div class="filter-group mb-3">
                <label for="categoryFilter">Կատեգորիա</label>
                <select id="categoryFilter" class="form-select">
                    <option value="">Բոլորը</option>
                </select>
            </div>

            <div class="filter-group mb-3">
                <label for="brandFilter">Բրենդ</label>
                <select id="brandFilter" class="form-select">
                    <option value="">Բոլորը</option>
                </select>
            </div>

            <div class="filter-group mb-3">
                <label for="osFilter">Օպերացիոն համակարգ</label>
                <select id="osFilter" class="form-select">
                    <option value="">Բոլորը</option>
                </select>
            </div>

            <div class="filter-group mb-3">
                <label for="ramFilter">RAM</label>
                <select id="ramFilter" class="form-select">
                    <option value="">Բոլորը</option>
                </select>
            </div>

            <div class="filter-group mb-3">
                <label>Գին (AMD)</label>
                <div class="d-flex gap-2">
                    <input id="minPrice" type="number" class="form-control" placeholder="Մին.">
                    <input id="maxPrice" type="number" class="form-control" placeholder="Մաքս.">
                </div>
            </div>

            <div class="filter-group mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="discountOnly">
                    <label class="form-check-label" for="discountOnly">
                        Միայն զեղչով
                    </label>
                </div>
            </div>

            <p class="text-muted-2 mb-0">
                Ֆիլտրերը ավտոմատ կիրառվում են փոփոխության պահին։
            </p>
        </aside>

        <!-- MAIN AREA -->
        <main class="col-12 col-lg-9 main-area">
            <!-- CART BAR -->
            <div class="cart-bar">
                <div>
                    <div class="cart-title">Զամբյուղ</div>
                    <div class="cart-summary-main">
                        <span id="cartItemsCount">0</span> ապրանք •
                        <span id="cartTotal">0</span> ֏
                    </div>
                    <div class="cart-summary-sub" id="cartSummarySub">
                        Զամբյուղում ապրանքներ չկան։
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a href="cart.html" class="btn btn-outline-dark btn-sm">
                        Բացել զամբյուղը
                    </a>
                </div>
            </div>

            <!-- PRODUCT LIST -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0 text-uppercase text-muted">Ապրանքներ</h6>
                <span class="text-muted-2">
          Ցույց է տրված՝ <span id="visibleCount">0</span> / <span id="totalCount">0</span>
        </span>
            </div>

            <div id="productsRow" class="row g-3">
                <!-- Products render here -->
            </div>
        </main>
    </div>
</div>

<script src="data.js"></script>
<script>
    // FILTER STATE
    const filterState = {
        categoryId: "",
        brandId: "",
        osId: "",
        ramId: "",
        minPrice: "",
        maxPrice: "",
        discountOnly: false
    };

    function applyFilters() {
        return products.filter(p => {
            if (filterState.categoryId && p.categoryId !== Number(filterState.categoryId)) return false;
            if (filterState.brandId && p.brandId !== Number(filterState.brandId)) return false;
            if (filterState.osId && p.opSysId !== Number(filterState.osId)) return false;
            if (filterState.ramId && p.ramId !== Number(filterState.ramId)) return false;

            const finalPrice = getFinalPrice(p);
            if (filterState.minPrice && finalPrice < Number(filterState.minPrice)) return false;
            if (filterState.maxPrice && finalPrice > Number(filterState.maxPrice)) return false;
            if (filterState.discountOnly && (!p.discount || p.discount <= 0)) return false;

            return true;
        });
    }

    function renderFilterOptions() {
        const categorySelect = document.getElementById("categoryFilter");
        categories.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.id;
            opt.textContent = c.name;
            categorySelect.appendChild(opt);
        });

        const brandSelect = document.getElementById("brandFilter");
        brands
            .filter(b => [1,2,3,4,5,6,7].includes(b.id))
            .forEach(b => {
                const opt = document.createElement("option");
                opt.value = b.id;
                opt.textContent = b.name;
                brandSelect.appendChild(opt);
            });

        const osSelect = document.getElementById("osFilter");
        operationSystems.forEach(o => {
            const opt = document.createElement("option");
            opt.value = o.id;
            opt.textContent = o.name;
            osSelect.appendChild(opt);
        });

        const ramSelect = document.getElementById("ramFilter");
        ram.forEach(r => {
            const opt = document.createElement("option");
            opt.value = r.id;
            opt.textContent = r.name;
            ramSelect.appendChild(opt);
        });
    }

    function updateCartSummaryBar() {
        const cart = loadCart();
        const count = getCartItemsCount(cart);
        const total = getCartTotal(cart);

        document.getElementById("cartItemsCount").textContent = count;
        document.getElementById("cartTotal").textContent = formatPrice(total);

        const summarySub = document.getElementById("cartSummarySub");
        if (!count) {
            summarySub.textContent = "Զամբյուղում ապրանքներ չկան։";
        } else {
            summarySub.textContent = `Միջին գին ≈ ${formatPrice(
                count ? Math.round(total / count) : 0
            )} ֏ / ապրանք`;
        }
    }

    function renderProducts() {
        const row = document.getElementById("productsRow");
        row.innerHTML = "";
        const filtered = applyFilters();

        document.getElementById("totalCount").textContent = products.length;
        document.getElementById("visibleCount").textContent = filtered.length;

        if (!filtered.length) {
            row.innerHTML = "<p class='text-muted-2 mt-2'>Համապատասխան արդյունքներ չկան։ Փորձեք փոխել ֆիլտրերը։</p>";
            return;
        }

        const cart = loadCart();

        filtered.forEach(p => {
            const col = document.createElement("div");
            col.className = "col-12 col-sm-6 col-md-4 col-xl-3";

            const brand = getBrand(p.brandId);
            const cat = getCategory(p.categoryId);
            const r = getRam(p.ramId);
            const finalPrice = getFinalPrice(p);

            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
        <div>
          <div class="product-image-wrapper">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div>
            <div class="product-name">${p.name}</div>
            <div class="product-meta">
              ${brand ? brand.name : ""}${r ? " • " + r.name : ""}${cat ? " • " + cat.name : ""}
            </div>
            <div class="price-row">
              <div class="price-main">${formatPrice(finalPrice)} ֏</div>
              ${
                p.discount
                    ? `<div class="price-old">${formatPrice(p.price)} ֏</div>
                     <span class="discount-badge">-${p.discount}%</span>`
                    : ""
            }
            </div>
          </div>
        </div>
        <div class="product-actions">
          <button class="btn btn-outline-dark btn-sm w-50 details-btn">
            Դիտել
          </button>
          <button class="btn btn-primary btn-sm w-50 add-btn">
            Զամբյուղ
          </button>
        </div>
      `;

            // Product details page
            card.querySelector(".details-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                window.location.href = "product.html?id=" + p.id;
            });

            // Card click էլ կարող է բացել product page
            card.addEventListener("click", () => {
                window.location.href = "product.html?id=" + p.id;
            });

            // Add to cart
            card.querySelector(".add-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                const currentCart = loadCart();
                const item = currentCart.find(i => i.productId === p.id);
                if (item) {
                    item.qty += 1;
                } else {
                    currentCart.push({ productId: p.id, qty: 1 });
                }
                saveCart(currentCart);
                updateCartSummaryBar();
            });

            col.appendChild(card);
            row.appendChild(col);
        });
    }

    // EVENT LISTENERS
    document.getElementById("categoryFilter").addEventListener("change", (e) => {
        filterState.categoryId = e.target.value;
        renderProducts();
    });
    document.getElementById("brandFilter").addEventListener("change", (e) => {
        filterState.brandId = e.target.value;
        renderProducts();
    });
    document.getElementById("osFilter").addEventListener("change", (e) => {
        filterState.osId = e.target.value;
        renderProducts();
    });
    document.getElementById("ramFilter").addEventListener("change", (e) => {
        filterState.ramId = e.target.value;
        renderProducts();
    });
    document.getElementById("minPrice").addEventListener("input", (e) => {
        filterState.minPrice = e.target.value;
        renderProducts();
    });
    document.getElementById("maxPrice").addEventListener("input", (e) => {
        filterState.maxPrice = e.target.value;
        renderProducts();
    });
    document.getElementById("discountOnly").addEventListener("change", (e) => {
        filterState.discountOnly = e.target.checked;
        renderProducts();
    });

    document.getElementById("resetFiltersBtn").addEventListener("click", () => {
        filterState.categoryId = "";
        filterState.brandId = "";
        filterState.osId = "";
        filterState.ramId = "";
        filterState.minPrice = "";
        filterState.maxPrice = "";
        filterState.discountOnly = false;

        document.getElementById("categoryFilter").value = "";
        document.getElementById("brandFilter").value = "";
        document.getElementById("osFilter").value = "";
        document.getElementById("ramFilter").value = "";
        document.getElementById("minPrice").value = "";
        document.getElementById("maxPrice").value = "";
        document.getElementById("discountOnly").checked = false;

        renderProducts();
    });

    // INIT
    renderFilterOptions();
    renderProducts();
    updateCartSummaryBar();
</script>
</body>
</html>
