<!doctype html>
<html lang="hy">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Products UI (No Modal) • DummyJSON</title>
    <style>
        :root{
            --bg:#0b0f14;
            --panel:#111827;
            --panel2:#0f172a;
            --card:#0b1220;
            --border: rgba(255,255,255,.10);
            --text:#e8eefc;
            --muted:#9aa6c3;
            --accent:#22c55e;
            --accent2:#38bdf8;
            --warn:#f59e0b;
            --danger:#fb7185;
            --radius:18px;
            --shadow: 0 18px 55px rgba(0,0,0,.45);
        }

        *{ box-sizing:border-box; }
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background:
                    radial-gradient(900px 550px at 10% 15%, rgba(34,197,94,.14), transparent 55%),
                    radial-gradient(900px 550px at 90% 15%, rgba(56,189,248,.12), transparent 55%),
                    radial-gradient(900px 550px at 50% 90%, rgba(251,113,133,.10), transparent 55%),
                    var(--bg);
            color:var(--text);
            min-height:100vh;
        }

        .wrap{ max-width:1250px; margin:0 auto; padding:20px; }

        /* Header */
        .head{
            border:1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
            border-radius: calc(var(--radius) + 4px);
            box-shadow: var(--shadow);
            padding:14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 14px;
            z-index: 10;
        }
        .brand{
            display:flex; align-items:center; gap:12px;
            min-width: 240px;
        }
        .mark{
            width:44px;height:44px;border-radius:16px;
            display:grid;place-items:center;
            background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.95));
            color:#04110b;
            font-weight:900;
            box-shadow: 0 12px 35px rgba(56,189,248,.18);
        }
        .brand h1{ margin:0; font-size:15px; letter-spacing:.2px; }
        .brand p{ margin:2px 0 0; color:var(--muted); font-size:12px; }

        .tools{
            display:flex;
            gap:10px;
            align-items:center;
            justify-content:flex-end;
            flex:1;
            flex-wrap:wrap;
        }
        .pill{
            display:flex; align-items:center; gap:10px;
            padding:10px 12px;
            border-radius: 16px;
            border:1px solid var(--border);
            background: rgba(0,0,0,.25);
            min-height:42px;
        }
        .pill .tag{
            font-size:12px;
            color:var(--muted);
            border:1px solid var(--border);
            background: rgba(255,255,255,.04);
            padding:6px 9px;
            border-radius: 999px;
            white-space:nowrap;
        }
        .pill input{
            border:none; outline:none; background:transparent;
            color:var(--text);
            min-width:240px;
        }
        .pill input::placeholder{ color: rgba(154,166,195,.7); }

        .select{
            border:none; outline:none; background:transparent;
            color:var(--text);
            cursor:pointer;
            min-width:120px;
        }
        .btn{
            cursor:pointer;
            border:1px solid var(--border);
            background: rgba(255,255,255,.06);
            color:var(--text);
            padding:10px 12px;
            border-radius: 16px;
            transition:.15s transform, .15s background;
        }
        .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
        .btn.primary{
            border:none;
            background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.95));
            color:#06120d;
            font-weight:900;
        }

        @media (max-width: 720px){
            .pill input{ min-width: 160px; }
        }

        /* Main layout */
        .grid{
            margin-top:14px;
            display:grid;
            grid-template-columns: 360px 1fr;
            gap:14px;
            align-items:start;
        }
        @media (max-width: 980px){
            .grid{ grid-template-columns: 1fr; }
        }

        /* Left: list */
        .left{
            border:1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow:hidden;
        }
        .leftHead{
            padding:12px 12px 10px;
            border-bottom:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            flex-wrap:wrap;
        }
        .meta{
            display:flex; gap:8px; flex-wrap:wrap; align-items:center;
        }
        .chip{
            font-size:12px;
            padding:6px 10px;
            border-radius:999px;
            border:1px solid var(--border);
            background: rgba(255,255,255,.04);
            color: var(--muted);
        }
        .catSelect{
            width:100%;
            border:none; outline:none;
            background: rgba(0,0,0,.22);
            border:1px solid var(--border);
            color: var(--text);
            border-radius: 14px;
            padding:10px 12px;
            cursor:pointer;
            margin-top:10px;
        }

        .list{
            max-height: 650px;
            overflow:auto;
            padding:10px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .item{
            display:grid;
            grid-template-columns: 66px 1fr;
            gap:10px;
            padding:10px;
            border-radius: 16px;
            border:1px solid transparent;
            background: rgba(0,0,0,.22);
            cursor:pointer;
            transition:.15s;
            align-items:center;
        }
        .item:hover{ border-color: rgba(56,189,248,.35); background: rgba(56,189,248,.08); }
        .item.active{ border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.10); }

        .thumb{
            width:66px; height:66px;
            border-radius: 14px;
            overflow:hidden;
            background: rgba(255,255,255,.04);
            border:1px solid var(--border);
        }
        .thumb img{
            width:100%; height:100%;
            object-fit:cover;
            display:block;
        }

        .itTitle{
            font-weight:900;
            font-size:13px;
            line-height:1.25;
            margin:0 0 4px;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
        }
        .itSub{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            color: var(--muted);
            font-size:12px;
        }
        .price{
            color: var(--text);
            font-weight:900;
        }

        .pager{
            border-top:1px solid var(--border);
            padding:12px;
            display:flex; align-items:center; justify-content:space-between;
            gap:10px;
            flex-wrap:wrap;
        }
        .pager .small{ color: var(--muted); font-size:12px; }
        .pager .right{
            display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        }
        .limit{
            border:1px solid var(--border);
            background: rgba(0,0,0,.22);
            color: var(--text);
            border-radius: 14px;
            padding:9px 10px;
            outline:none;
            cursor:pointer;
        }

        /* Right: details */
        .right{
            border:1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow:hidden;
            min-height: 420px;
        }
        .rightHead{
            padding:12px 12px 10px;
            border-bottom:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            flex-wrap:wrap;
        }
        .rightBody{ padding:12px; }

        .hero{
            display:grid;
            grid-template-columns: 1.1fr .9fr;
            gap:12px;
            align-items:stretch;
        }
        @media (max-width: 980px){
            .hero{ grid-template-columns: 1fr; }
        }

        .preview{
            border-radius: 18px;
            overflow:hidden;
            border:1px solid var(--border);
            background: rgba(0,0,0,.22);
            min-height: 320px;
        }
        .preview img{ width:100%; height:100%; object-fit:cover; display:block; }

        .info{
            border-radius: 18px;
            border:1px solid var(--border);
            background: rgba(0,0,0,.18);
            padding:12px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .hTitle{
            margin:0;
            font-size:18px;
            font-weight:950;
            letter-spacing:.2px;
            line-height:1.2;
        }
        .desc{
            margin:0;
            color: rgba(154,166,195,.95);
            line-height:1.55;
            font-size:13px;
        }
        .krow{ display:flex; gap:8px; flex-wrap:wrap; }
        .pill2{
            font-size:12px;
            padding:6px 10px;
            border-radius:999px;
            border:1px solid var(--border);
            background: rgba(255,255,255,.04);
            color: var(--muted);
        }
        .stats{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
            margin-top:6px;
        }
        @media (max-width: 520px){ .stats{ grid-template-columns: 1fr; } }
        .stat{
            border:1px solid var(--border);
            background: rgba(255,255,255,.04);
            border-radius: 16px;
            padding:10px;
        }
        .stat b{ display:block; font-size:12px; color: var(--muted); margin-bottom:6px; }
        .stat .v{ font-size:16px; font-weight:950; }

        .actions{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:auto;
            padding-top:10px;
            border-top:1px dashed rgba(255,255,255,.12);
        }

        /* Skeleton */
        .skeleton{ position:relative; overflow:hidden; }
        .skeleton::after{
            content:"";
            position:absolute; inset:0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.1s infinite;
        }
        @keyframes shimmer{ 100%{ transform: translateX(100%); } }

        .toast{
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: rgba(17,24,39,.92);
            border:1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            display:none;
            max-width: 360px;
            z-index: 50;
        }
        .toast.show{ display:block; }
        .toast b{ font-size:13px; }
        .toast p{ margin:4px 0 0; color:var(--muted); font-size:12px; line-height:1.35; }
    </style>
</head>
<body>
<div class="wrap">
    <header class="head">
        <div class="brand">
            <div class="mark">PJ</div>
            <div>
                <h1>Products Panel (No Modal)</h1>
                <p>Left list → click → right details</p>
            </div>
        </div>

        <div class="tools">
            <div class="pill">
                <span class="tag">🔎 Search</span>
                <input id="q" placeholder="օր․ phone, laptop, perfume..." />
            </div>

            <div class="pill">
                <span class="tag">↕ Sort</span>
                <select id="sortBy" class="select">
                    <option value="">Default</option>
                    <option value="title">Title</option>
                    <option value="price">Price</option>
                </select>
                <select id="order" class="select" style="min-width:95px">
                    <option value="asc">ASC</option>
                    <option value="desc">DESC</option>
                </select>
            </div>

            <button class="btn" id="reset">Reset</button>
            <button class="btn primary" id="reload">Reload</button>
        </div>
    </header>

    <section class="grid">
        <!-- LEFT -->
        <aside class="left">
            <div class="leftHead">
                <div class="meta">
                    <span class="chip" id="totalChip">Total: –</span>
                    <span class="chip" id="rangeChip">–</span>
                </div>
                <span class="chip" id="endpointChip">/products</span>

                <select id="category" class="catSelect">
                    <option value="">All categories</option>
                </select>
            </div>

            <div class="list" id="list">
                <!-- items -->
            </div>

            <div class="pager">
                <div class="leftBtns">
                    <button class="btn" id="prev">← Prev</button>
                    <button class="btn" id="next">Next →</button>
                    <span class="small" id="pageInfo">page: –</span>
                </div>
                <div class="right">
                    <span class="small">Limit</span>
                    <select id="limit" class="limit">
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                        <option value="30" selected>30</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- RIGHT -->
        <main class="right">
            <div class="rightHead">
                <div class="meta">
                    <span class="chip" id="pickedChip">Pick a product</span>
                    <span class="chip" id="catChip">—</span>
                </div>
                <span class="chip" id="idChip">id: —</span>
            </div>

            <div class="rightBody">
                <div class="hero" id="detail">
                    <!-- details -->
                </div>
            </div>
        </main>
    </section>
</div>

<div class="toast" id="toast">
    <b id="tTitle">—</b>
    <p id="tText">—</p>
</div>

<script>
    const API = "https://dummyjson.com/products";

    const el = {
        q: document.getElementById("q"),
        sortBy: document.getElementById("sortBy"),
        order: document.getElementById("order"),
        reset: document.getElementById("reset"),
        reload: document.getElementById("reload"),

        category: document.getElementById("category"),
        list: document.getElementById("list"),

        totalChip: document.getElementById("totalChip"),
        rangeChip: document.getElementById("rangeChip"),
        endpointChip: document.getElementById("endpointChip"),

        prev: document.getElementById("prev"),
        next: document.getElementById("next"),
        limit: document.getElementById("limit"),
        pageInfo: document.getElementById("pageInfo"),

        pickedChip: document.getElementById("pickedChip"),
        catChip: document.getElementById("catChip"),
        idChip: document.getElementById("idChip"),
        detail: document.getElementById("detail"),

        toast: document.getElementById("toast"),
        tTitle: document.getElementById("tTitle"),
        tText: document.getElementById("tText"),
    };

    const state = {
        q: "",
        category: "",
        sortBy: "",
        order: "asc",
        limit: 30,
        skip: 0,
        total: 0,
        activeId: null,
        lastList: [],
        lastEndpoint: "/products"
    };

    const fmt = (n) => new Intl.NumberFormat("en-US").format(n);
    const money = (n) => "$" + new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(n);

    function safe(s){
        return String(s ?? "").replace(/[<>&"]/g, (c)=>({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]));
    }

    function debounce(fn, ms=350){
        let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
    }

    async function apiJson(url){
        const res = await fetch(url);
        if(!res.ok) throw new Error("Request failed: " + res.status);
        return res.json();
    }

    function showToast(title, text){
        el.tTitle.textContent = title;
        el.tText.textContent = text;
        el.toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(()=>el.toast.classList.remove("show"), 2400);
    }

    function buildListUrl(){
        const params = new URLSearchParams();
        params.set("limit", String(state.limit));
        params.set("skip", String(state.skip));
        params.set("select", "id,title,price,thumbnail,category,brand,rating,discountPercentage,stock,description");

        if(state.sortBy){
            params.set("sortBy", state.sortBy);
            params.set("order", state.order || "asc");
        }

        if(state.q.trim()){
            state.lastEndpoint = `/products/search?q=${encodeURIComponent(state.q.trim())}`;
            return `${API}/search?q=${encodeURIComponent(state.q.trim())}&${params.toString()}`;
        }
        if(state.category){
            state.lastEndpoint = `/products/category/${state.category}`;
            return `${API}/category/${encodeURIComponent(state.category)}?${params.toString()}`;
        }
        state.lastEndpoint = "/products";
        return `${API}?${params.toString()}`;
    }

    function setListLoading(){
        el.list.innerHTML = "";
        for(let i=0;i<Math.min(12, state.limit);i++){
            const row = document.createElement("div");
            row.className = "item skeleton";
            row.innerHTML = `
          <div class="thumb"></div>
          <div>
            <div style="height:13px;width:85%;background:rgba(255,255,255,.07);border-radius:10px;margin-bottom:8px"></div>
            <div style="height:11px;width:70%;background:rgba(255,255,255,.06);border-radius:10px"></div>
          </div>
        `;
            el.list.appendChild(row);
        }
    }

    function setDetailEmpty(){
        el.detail.innerHTML = `
        <div class="preview skeleton" style="min-height:320px"></div>
        <div class="info">
          <h2 class="hTitle">Select a product</h2>
          <p class="desc">Ձախից սեղմիր ապրանքի վրա, ու այստեղ կտեսնես բոլոր մանրամասները՝ առանց մոդալի։</p>
          <div class="krow">
            <span class="pill2">Tip: Search-ը մաքրելով կվերադառնաս All-ին</span>
            <span class="pill2">Category ընտրելիս Search-ը reset է լինում</span>
          </div>
          <div class="stats">
            <div class="stat"><b>Price</b><div class="v">—</div></div>
            <div class="stat"><b>Rating</b><div class="v">—</div></div>
            <div class="stat"><b>Stock</b><div class="v">—</div></div>
          </div>
          <div class="actions">
            <button class="btn primary" disabled>Add to cart</button>
            <button class="btn" disabled>Wishlist</button>
          </div>
        </div>
      `;
    }

    function updateMeta(){
        el.endpointChip.textContent = state.lastEndpoint;

        const from = state.total ? (state.skip + 1) : 0;
        const to = Math.min(state.skip + state.limit, state.total);

        el.totalChip.textContent = "Total: " + fmt(state.total);
        el.rangeChip.textContent = `Showing ${from}-${to}`;

        const page = Math.floor(state.skip / state.limit) + 1;
        const pages = Math.max(1, Math.ceil(state.total / state.limit));
        el.pageInfo.textContent = `page: ${page} / ${pages}`;

        el.prev.disabled = state.skip <= 0;
        el.next.disabled = (state.skip + state.limit) >= state.total;
        el.prev.style.opacity = el.prev.disabled ? .55 : 1;
        el.next.style.opacity = el.next.disabled ? .55 : 1;
    }

    function renderList(products){
        state.lastList = products;
        el.list.innerHTML = "";

        if(!products.length){
            el.list.innerHTML = `<div style="padding:12px" class="chip">No results</div>`;
            return;
        }

        for(const p of products){
            const row = document.createElement("div");
            row.className = "item" + (p.id === state.activeId ? " active" : "");
            row.innerHTML = `
          <div class="thumb"><img src="${safe(p.thumbnail)}" alt="${safe(p.title)}" loading="lazy"></div>
          <div>
            <div class="itTitle">${safe(p.title)}</div>
            <div class="itSub">
              <span>${safe(p.category)} • <span class="price">${money(p.price)}</span></span>
              <span>★ ${Number(p.rating ?? 0).toFixed(1)}</span>
            </div>
          </div>
        `;
            row.addEventListener("click", () => pickProduct(p));
            el.list.appendChild(row);
        }
    }

    function pickProduct(p){
        state.activeId = p.id;

        [...el.list.querySelectorAll(".item")].forEach((node)=>{
            const title = node.querySelector(".itTitle")?.textContent;
            node.classList.toggle("active", title === p.title);
        });

        el.pickedChip.textContent = p.title;
        el.catChip.textContent = "cat: " + p.category;
        el.idChip.textContent = "id: " + p.id;

        const disc = p.discountPercentage != null ? `-${Math.round(p.discountPercentage)}%` : "—";
        el.detail.innerHTML = `
        <div class="preview">
          <img src="${safe(p.thumbnail)}" alt="${safe(p.title)}">
        </div>
        <div class="info">
          <h2 class="hTitle">${safe(p.title)}</h2>
          <p class="desc">${safe(p.description || "No description")}</p>

          <div class="krow">
            <span class="pill2"><b style="color:var(--text)">Brand:</b> ${safe(p.brand || "—")}</span>
            <span class="pill2"><b style="color:var(--text)">Category:</b> ${safe(p.category)}</span>
            <span class="pill2"><b style="color:var(--text)">Discount:</b> ${safe(disc)}</span>
          </div>

          <div class="stats">
            <div class="stat"><b>Price</b><div class="v">${money(p.price)}</div></div>
            <div class="stat"><b>Rating</b><div class="v">★ ${Number(p.rating ?? 0).toFixed(1)}</div></div>
            <div class="stat"><b>Stock</b><div class="v">${safe(p.stock ?? "—")}</div></div>
          </div>

          <div class="actions">
            <button class="btn primary" id="addBtn">Add to cart</button>
            <button class="btn" id="wishBtn">Wishlist</button>
          </div>
        </div>
      `;

        document.getElementById("addBtn").onclick = () => showToast("Added ✅", `${p.title} (demo)`);
        document.getElementById("wishBtn").onclick = () => showToast("Saved ⭐", `${p.title} (demo)`);
    }

    async function loadCategories(){
        let list = [];
        try{
            list = await apiJson("https://dummyjson.com/products/category-list");
        }catch(e){
            const alt = await apiJson("https://dummyjson.com/products/categories");
            list = alt.map(x => typeof x === "string" ? x : (x.slug ?? x.name ?? String(x)));
        }

        // Fill select
        for(const c of list){
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            el.category.appendChild(opt);
        }
    }

    async function loadList(){
        setListLoading();
        el.endpointChip.textContent = "Loading…";
        try{
            const url = buildListUrl();
            const data = await apiJson(url);

            const products = data.products || [];
            state.total = Number(data.total ?? products.length ?? 0);

            el.endpointChip.textContent = state.lastEndpoint;
            renderList(products);
            updateMeta();

            // Auto-pick first item if none selected
            if(products.length && !state.activeId){
                pickProduct(products[0]);
            }
        }catch(err){
            el.list.innerHTML = `<div style="padding:12px" class="chip">Error: ${safe(err.message)}</div>`;
            el.endpointChip.textContent = "Failed";
        }
    }

    // Events
    el.q.addEventListener("input", debounce(() => {
        state.q = el.q.value;
        state.category = "";
        el.category.value = "";
        state.skip = 0;
        state.activeId = null;
        setDetailEmpty();
        loadList();
    }, 420));

    el.category.addEventListener("change", () => {
        state.category = el.category.value;
        state.q = "";
        el.q.value = "";
        state.skip = 0;
        state.activeId = null;
        setDetailEmpty();
        loadList();
    });

    el.sortBy.addEventListener("change", () => {
        state.sortBy = el.sortBy.value;
        state.skip = 0;
        loadList();
    });
    el.order.addEventListener("change", () => {
        state.order = el.order.value;
        state.skip = 0;
        loadList();
    });

    el.limit.addEventListener("change", () => {
        state.limit = Number(el.limit.value);
        state.skip = 0;
        state.activeId = null;
        setDetailEmpty();
        loadList();
    });

    el.prev.addEventListener("click", () => {
        state.skip = Math.max(0, state.skip - state.limit);
        state.activeId = null;
        setDetailEmpty();
        loadList();
    });
    el.next.addEventListener("click", () => {
        state.skip = Math.min(Math.max(0, state.total - state.limit), state.skip + state.limit);
        state.activeId = null;
        setDetailEmpty();
        loadList();
    });

    el.reset.addEventListener("click", () => {
        state.q = "";
        state.category = "";
        state.sortBy = "";
        state.order = "asc";
        state.limit = 30;
        state.skip = 0;
        state.activeId = null;

        el.q.value = "";
        el.category.value = "";
        el.sortBy.value = "";
        el.order.value = "asc";
        el.limit.value = "30";

        setDetailEmpty();
        loadList();
        showToast("Reset 🔄", "Վերադարձավ default վիճակին");
    });

    el.reload.addEventListener("click", () => {
        loadList();
        showToast("Reload ✅", "Թարմացվեց");
    });

    // init
    (async function init(){
        setDetailEmpty();
        await loadCategories();
        await loadList();
    })();
</script>
</body>
</html>
