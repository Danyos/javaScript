<!doctype html>
<html lang="hy">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop + Cart + Modal • DummyJSON</title>

    <style>
        :root{
            --bg:#0b0f17;
            --surface:#0f1625;
            --surface2:#0c1321;
            --text:#eaf1ff;
            --muted:#9fb0d0;
            --line:rgba(255,255,255,.10);
            --line2:rgba(255,255,255,.14);
            --shadow: 0 22px 70px rgba(0,0,0,.45);

            --r-lg:26px;
            --r-md:20px;
            --r-sm:16px;

            --accent1:#7c3aed;
            --accent2:#38bdf8;
            --ok:#22c55e;
            --warn:#fbbf24;
            --bad:#fb7185;
        }

        *{ box-sizing:border-box; }
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            background:
                    radial-gradient(1200px 700px at 20% 8%, rgba(124,58,237,.20), transparent 60%),
                    radial-gradient(1200px 700px at 82% 10%, rgba(56,189,248,.14), transparent 60%),
                    radial-gradient(1200px 700px at 50% 92%, rgba(34,197,94,.12), transparent 60%),
                    var(--bg);
            color:var(--text);
            min-height:100vh;
        }
        .wrap{ max-width:1240px; margin:0 auto; padding:20px; }

        /* UI primitives */
        .panel{
            border:1px solid var(--line);
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
            border-radius: var(--r-lg);
            box-shadow: var(--shadow);
            overflow:hidden;
        }
        .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .chip{
            font-size:12px;
            color:var(--muted);
            border:1px solid var(--line);
            background: rgba(0,0,0,.18);
            padding:7px 10px;
            border-radius: 999px;
            white-space:nowrap;
        }
        .field{
            display:flex; align-items:center; gap:10px;
            padding:10px 12px;
            border-radius: var(--r-sm);
            border:1px solid var(--line);
            background: rgba(0,0,0,.18);
            min-height:44px;
        }
        .tag{
            font-size:12px;
            color:var(--muted);
            border:1px solid var(--line);
            background: rgba(255,255,255,.04);
            padding:6px 10px;
            border-radius: 999px;
            white-space:nowrap;
        }
        input{
            border:none; outline:none; background:transparent;
            color:var(--text);
            min-width: 240px;
        }
        input::placeholder{ color: rgba(159,176,208,.75); }
        select{
            border:none; outline:none;
            background: transparent;
            color:var(--text);
            cursor:pointer;
            min-width: 160px;
        }
        .btn{
            border:1px solid var(--line);
            background: rgba(255,255,255,.06);
            color:var(--text);
            padding:10px 12px;
            border-radius: var(--r-sm);
            cursor:pointer;
            transition:.15s transform, .15s background, .15s opacity;
            user-select:none;
        }
        .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
        .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
        .btn.primary{
            border:none;
            background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.95));
            color:#07131a;
            font-weight:1000;
        }
        .btn.danger{
            border:none;
            background: linear-gradient(135deg, rgba(251,113,133,.95), rgba(251,191,36,.90));
            color:#1a0b12;
            font-weight:1000;
        }
        .btn.ghost{ background: rgba(0,0,0,.12); }
        .btn.sm{ padding:9px 10px; font-size:13px; border-radius: 14px; }

        @media (max-width: 720px){
            input{ min-width: 160px; }
            select{ min-width: 130px; }
        }

        /* Header */
        .headTop{ padding:18px 18px 12px; }
        .brand{ display:flex; gap:14px; align-items:center; min-width:260px; }
        .logo{
            width:50px;height:50px;border-radius:18px;
            background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.95));
            display:grid; place-items:center;
            color:#081126;
            font-weight:1000;
            box-shadow: 0 16px 50px rgba(56,189,248,.16);
            user-select:none;
        }
        .brand h1{ margin:0; font-size:18px; }
        .brand p{ margin:3px 0 0; color:var(--muted); font-size:12.5px; }

        .kpis{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; flex:1; }
        .kpi{
            border:1px solid var(--line);
            background: rgba(0,0,0,.18);
            border-radius: 16px;
            padding:10px 12px;
            min-width: 160px;
        }
        .kpi small{ display:block; color:var(--muted); font-size:12px; }
        .kpi b{ display:block; margin-top:4px; font-size:14px; }

        .filters{
            border-top:1px solid var(--line);
            padding:12px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            align-items:center;
            justify-content:space-between;
            position: sticky;
            top: 14px;
            z-index: 10;
            backdrop-filter: blur(10px);
            background: linear-gradient(180deg, rgba(15,22,37,.78), rgba(15,22,37,.52));
        }
        .rowL,.rowR{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

        /* Products */
        .pHead{ padding:14px 16px; border-bottom:1px solid var(--line); }
        .pBody{ padding:16px; }
        .pFoot{ padding:14px 16px; border-top:1px solid var(--line); background: rgba(0,0,0,.10); }

        .grid{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            gap:12px;
        }
        @media (max-width: 1150px){ .grid{ grid-template-columns: repeat(3, 1fr);} }
        @media (max-width: 900px){ .grid{ grid-template-columns: repeat(2, 1fr);} }
        @media (max-width: 560px){ .grid{ grid-template-columns: 1fr;} }

        .card{
            border:1px solid var(--line);
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.14));
            border-radius: var(--r-md);
            overflow:hidden;
            transition:.16s transform, .16s border-color, .16s box-shadow;
            display:flex;
            flex-direction:column;
            min-height: 395px;
            position:relative;
        }
        .card:hover{
            transform: translateY(-2px);
            border-color: rgba(56,189,248,.35);
            box-shadow: 0 20px 55px rgba(0,0,0,.35);
        }
        .img{
            height: 190px;
            background: rgba(0,0,0,.25);
            position:relative;
            overflow:hidden;
        }
        .img img{ width:100%; height:100%; object-fit:cover; display:block; }
        .badges{
            position:absolute; left:10px; right:10px; top:10px;
            display:flex; align-items:center; justify-content:space-between; gap:8px;
        }
        .pill{
            font-size:12px;
            padding:6px 10px;
            border-radius: 999px;
            border:1px solid rgba(255,255,255,.18);
            background: rgba(0,0,0,.38);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 22px rgba(0,0,0,.25);
            white-space:nowrap;
        }
        .pill.rating{ border-color: rgba(251,191,36,.35); }
        .pill.off{ border-color: rgba(251,113,133,.35); }
        .pill.selected{
            border-color: rgba(34,197,94,.45);
            background: rgba(34,197,94,.14);
            font-weight:900;
        }

        .cBody{
            padding:12px;
            display:flex;
            flex-direction:column;
            gap:8px;
            flex:1;
        }
        .title{
            font-size:14px;
            font-weight:950;
            line-height:1.25;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
            min-height: 36px;
        }
        .desc{
            color: rgba(159,176,208,.92);
            font-size:12px;
            line-height:1.45;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
            min-height: 34px;
        }
        .bottom{
            margin-top:auto;
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding-top:10px;
            border-top:1px dashed rgba(255,255,255,.12);
        }
        .price{ font-weight:1000; font-size:16px; }
        .mini{
            font-size:12px;
            color:var(--muted);
            border:1px solid var(--line);
            background: rgba(0,0,0,.16);
            padding:6px 10px;
            border-radius: 999px;
            max-width: 140px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        .actions{ display:flex; gap:10px; padding:12px; padding-top:0; }
        .actions .btn{ flex:1; }

        /* Cart drawer */
        .overlay{
            position:fixed; inset:0;
            background: rgba(0,0,0,.55);
            display:none;
            z-index: 50;
        }
        .overlay.show{ display:block; }
        .drawer{
            position: fixed; top:0; right:-420px;
            width: 420px; height: 100vh;
            background: linear-gradient(180deg, rgba(15,22,37,.98), rgba(10,14,25,.96));
            border-left:1px solid var(--line2);
            box-shadow: -20px 0 60px rgba(0,0,0,.45);
            z-index: 60;
            transition: right .22s ease;
            display:flex; flex-direction:column;
        }
        .drawer.open{ right:0; }
        @media (max-width: 460px){ .drawer{ width: 100%; right:-100%; } }

        .dHead{
            padding:14px;
            border-bottom:1px solid var(--line);
            display:flex; align-items:center; justify-content:space-between; gap:10px;
        }
        .x{
            width:42px;height:42px;
            border-radius: 16px;
            border:1px solid var(--line);
            background: rgba(255,255,255,.06);
            color: var(--text);
            cursor:pointer;
        }
        .dMeta{
            padding:12px 14px;
            display:flex; gap:10px; flex-wrap:wrap;
            border-bottom:1px solid var(--line);
        }
        .cartList{
            padding:12px;
            overflow:auto;
            flex:1;
            display:flex; flex-direction:column; gap:10px;
        }
        .cartItem{
            border:1px solid var(--line);
            background: rgba(0,0,0,.18);
            border-radius: 18px;
            padding:10px;
            display:grid;
            grid-template-columns: 62px 1fr;
            gap:10px;
            align-items:center;
        }
        .cThumb{
            width:62px;height:62px;
            border-radius: 16px;
            overflow:hidden;
            border:1px solid var(--line);
            background: rgba(255,255,255,.04);
        }
        .cThumb img{ width:100%; height:100%; object-fit:cover; display:block; }
        .cTitle{
            font-weight:950;
            font-size:13px;
            line-height:1.25;
            margin:0 0 6px;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
        }
        .cSub{
            display:flex; align-items:center; justify-content:space-between; gap:8px;
            flex-wrap:wrap;
            color: var(--muted);
            font-size:12px;
        }
        .qty{
            display:flex; align-items:center; gap:8px;
        }
        .qbtn{
            width:34px;height:34px;
            border-radius: 14px;
            border:1px solid var(--line);
            background: rgba(255,255,255,.06);
            color: var(--text);
            cursor:pointer;
            font-weight:900;
        }
        .qnum{ min-width: 30px; text-align:center; font-weight:900; color: var(--text); }
        .remove{
            border:1px solid rgba(251,113,133,.35);
            background: rgba(251,113,133,.12);
            color: var(--text);
            padding:8px 10px;
            border-radius: 14px;
            cursor:pointer;
            font-weight:900;
            font-size:12px;
        }
        .dFoot{
            border-top:1px solid var(--line);
            padding:12px 14px;
            background: rgba(0,0,0,.10);
        }
        .totalRow{
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding:10px 0;
        }
        .totalRow small{ color: var(--muted); }
        .totalRow b{ font-size:18px; font-weight:1000; }
        .footBtns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
        .footBtns .btn{ flex:1; }

        /* Modal */
        .modalOverlay{
            position: fixed; inset:0;
            background: rgba(0,0,0,.62);
            display:none;
            z-index: 90;
        }
        .modalOverlay.show{ display:block; }

        .modal{
            position: fixed;
            inset: 0;
            display:none;
            z-index: 100;
            padding: 20px;
            overflow:auto;
        }
        .modal.show{ display:block; }
        .modalCard{
            max-width: 980px;
            margin: 40px auto;
            border:1px solid var(--line2);
            background: linear-gradient(180deg, rgba(15,22,37,.98), rgba(10,14,25,.96));
            border-radius: var(--r-lg);
            box-shadow: var(--shadow);
            overflow:hidden;
        }
        .mHead{
            padding:14px 16px;
            border-bottom:1px solid var(--line);
            display:flex; align-items:center; justify-content:space-between; gap:10px;
        }
        .mBody{
            padding:16px;
            display:grid;
            grid-template-columns: 1.1fr .9fr;
            gap:14px;
            align-items:start;
        }
        @media (max-width: 900px){ .mBody{ grid-template-columns: 1fr; } }

        .gallery{
            border:1px solid var(--line);
            background: rgba(0,0,0,.18);
            border-radius: 22px;
            overflow:hidden;
        }
        .mainImg{ width:100%; height: 360px; background: rgba(0,0,0,.22); }
        .mainImg img{ width:100%; height:100%; object-fit:cover; display:block; }

        .thumbs{
            border-top:1px solid var(--line);
            padding:10px;
            display:flex;
            gap:10px;
            overflow:auto;
        }
        .t{
            width:72px;height:56px;
            border-radius: 14px;
            border:1px solid var(--line);
            overflow:hidden;
            cursor:pointer;
            opacity:.85;
            flex: 0 0 auto;
            background: rgba(255,255,255,.04);
        }
        .t:hover{ opacity:1; border-color: rgba(56,189,248,.35); }
        .t.active{ opacity:1; border-color: rgba(34,197,94,.45); }
        .t img{ width:100%; height:100%; object-fit:cover; display:block; }

        .mInfo{
            border:1px solid var(--line);
            background: rgba(0,0,0,.18);
            border-radius: 22px;
            padding:14px;
            display:flex;
            flex-direction:column;
            gap:10px;
            min-height: 420px;
        }
        .mInfo h2{ margin:0; font-size:18px; font-weight:1000; line-height:1.2; }
        .mInfo p{ margin:0; color: rgba(159,176,208,.96); line-height:1.55; font-size:13px; }
        .krow{ display:flex; gap:8px; flex-wrap:wrap; }
        .k{
            font-size:12px;
            padding:6px 10px;
            border-radius: 999px;
            border:1px solid var(--line);
            background: rgba(255,255,255,.04);
            color: var(--muted);
        }
        .stats{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:10px;
            margin-top:4px;
        }
        @media (max-width: 520px){ .stats{ grid-template-columns: 1fr; } }
        .stat{
            border:1px solid var(--line);
            background: rgba(0,0,0,.14);
            border-radius: 18px;
            padding:10px;
        }
        .stat small{ display:block; color:var(--muted); font-size:12px; }
        .stat b{ display:block; margin-top:6px; font-size:16px; font-weight:1000; }

        .qtyBox{
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            border-top:1px dashed rgba(255,255,255,.14);
            padding-top:12px;
            margin-top:auto;
        }
        .qty2{ display:flex; align-items:center; gap:8px; }
        .qbtn2{
            width:38px;height:38px;
            border-radius: 14px;
            border:1px solid var(--line);
            background: rgba(255,255,255,.06);
            color: var(--text);
            cursor:pointer;
            font-weight:900;
        }
        .qnum2{ min-width: 34px; text-align:center; font-weight:1000; }

        /* Skeleton */
        .sk{ position:relative; overflow:hidden; }
        .sk::after{
            content:"";
            position:absolute; inset:0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
            transform: translateX(-100%);
            animation: sh 1.1s infinite;
        }
        @keyframes sh{ 100%{ transform: translateX(100%);} }

        /* Toast */
        .toast{
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: rgba(15,22,37,.92);
            border:1px solid var(--line);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            display:none;
            max-width: 360px;
            z-index: 120;
            backdrop-filter: blur(10px);
        }
        .toast.show{ display:block; }
        .toast b{ font-size:13px; }
        .toast p{ margin:4px 0 0; color:var(--muted); font-size:12px; line-height:1.35; }
    </style>
</head>
<body>
<div class="wrap">

    <!-- HEADER -->
    <section class="panel">
        <div class="headTop row">
            <div class="brand">
                <div class="logo">SJ</div>
                <div>
                    <h1>Shop + Cart + Modal</h1>
                    <p>View → Modal • Selected badge if in cart</p>
                </div>
            </div>

            <div class="kpis">
                <div class="kpi"><small>Endpoint</small><b id="endpointText">/products</b></div>
                <div class="kpi"><small>Total products</small><b id="totalText">—</b></div>
                <div class="kpi"><small>Showing</small><b id="showingText">—</b></div>
            </div>
        </div>

        <div class="filters">
            <div class="rowL">
                <div class="field">
                    <span class="tag">🔎 Search</span>
                    <input id="q" placeholder="օր․ phone, laptop, perfume..." />
                </div>

                <div class="field">
                    <span class="tag">🧩 Category</span>
                    <select id="cat">
                        <option value="">All</option>
                    </select>
                </div>
            </div>

            <div class="rowR">
                <div class="field">
                    <span class="tag">↕ Sort</span>
                    <select id="sortBy">
                        <option value="">Default</option>
                        <option value="title">Title</option>
                        <option value="price">Price</option>
                    </select>
                    <select id="order" style="min-width:110px">
                        <option value="asc">ASC</option>
                        <option value="desc">DESC</option>
                    </select>
                </div>

                <button class="btn ghost" id="reset">Reset</button>
                <button class="btn primary" id="reload">Reload</button>
                <button class="btn primary" id="openCart">🛒 Cart <span id="cartCount" style="opacity:.85">(0)</span></button>
            </div>
        </div>
    </section>

    <!-- PRODUCTS -->
    <section class="panel" style="margin-top:14px">
        <div class="pHead row">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                <span class="chip" id="label">Loading…</span>
                <span class="chip" id="pageText">page: –</span>
                <span class="chip" id="skipText">skip: 0</span>
            </div>
            <span class="chip">Selected = in cart</span>
        </div>

        <div class="pBody">
            <div class="grid" id="grid"></div>
        </div>

        <div class="pFoot row">
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                <button class="btn" id="prev">← Prev</button>
                <button class="btn" id="next">Next →</button>
                <span class="small" id="rangeText" style="color:var(--muted);font-size:12px">—</span>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                <span class="small" style="color:var(--muted);font-size:12px">Limit</span>
                <select id="limit" style="border:1px solid var(--line); background: rgba(0,0,0,.18); padding:10px 12px; border-radius: var(--r-sm); color: var(--text);">
                    <option value="8">8</option>
                    <option value="12">12</option>
                    <option value="16">16</option>
                    <option value="24">24</option>
                    <option value="30" selected>30</option>
                </select>
            </div>
        </div>
    </section>
</div>

<!-- CART -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
    <div class="dHead">
        <b>🛒 Cart</b>
        <button class="x" id="closeCart">✕</button>
    </div>

    <div class="dMeta">
        <span class="chip" id="cartItemsChip">Items: 0</span>
        <span class="chip" id="cartQtyChip">Qty: 0</span>
    </div>

    <div class="cartList" id="cartList"><div class="chip">Cart is empty</div></div>

    <div class="dFoot">
        <div class="totalRow">
            <small>Total</small>
            <b id="cartTotal">$0</b>
        </div>
        <div class="footBtns">
            <button class="btn danger" id="clearCart">Clear</button>
            <button class="btn primary" id="buyBtn">Buy</button>
        </div>
        <div class="small" style="margin-top:10px; color:var(--muted);font-size:12px">
            * Demo checkout — իրական վճարում չի արվում
        </div>
    </div>
</aside>

<!-- PRODUCT MODAL -->
<div class="modalOverlay" id="mOverlay"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Product modal">
    <div class="modalCard">
        <div class="mHead">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                <span class="chip" id="mTitle">Loading…</span>
                <span class="chip" id="mCat">—</span>
                <span class="chip" id="mId">id: —</span>
            </div>
            <button class="x" id="mClose">✕</button>
        </div>

        <div class="mBody" id="mBody">
            <div class="gallery sk" style="min-height:420px"></div>
            <div class="mInfo sk" style="min-height:420px"></div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <b id="tTitle">—</b>
    <p id="tText">—</p>
