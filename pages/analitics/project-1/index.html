<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Օրվա Առաջադրանքներ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {
            background-color: #f2f6fb;
            font-family: sans-serif;
            padding: 40px;
        }

        .box {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }

        #result {
            margin-top: 20px;
        }
    </style>

</head>
<body>
<div class="box">
    <h2>🎯 Օրվա Առաջադրանքներ</h2>
    <button class="btn btn-success w-100 my-3" id="addTask">➕ Ավելացնել առաջադրանք</button>
    <form id="formData">


        <div id="taskList">
        </div>
        <button class="btn btn-primary w-100" id="analyze">📊 Վերլուծել</button>
    </form>
</div>

<div id="result" class="mt-4">
    <p>✅ Ընդհանուր առաջադրանքներ՝ <strong>-</strong></p>
    <p>📌 Կատարված է՝ <strong>-</strong> (0%)</p>
    <p>🕓 Ժամանակ՝ <strong>-</strong> ժամ</p>
</div>

<script src="script.js"></script>
</body>
</html>
