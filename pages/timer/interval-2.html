<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Smart Habit Tracker (setInterval)</title>
    <style>
        *{box-sizing:border-box}
        body{
            margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
            background:#0b1220; color:#e9eefc;
            min-height:100vh; display:grid; place-items:center; padding:18px;
        }
        .card{
            width:min(820px,100%);
            background:#111a2e;
            border:1px solid #1f2a44;
            border-radius:18px;
            padding:18px;
            box-shadow:0 14px 40px rgba(0,0,0,.35);
            display:grid; gap:14px;
        }
        header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;}
        h1{margin:0; font-size:24px}
        .sub{margin:6px 0 0; opacity:.8; font-size:13px}
        .badge{
            border:1px solid #2a385b; background:#0d1527;
            padding:8px 10px; border-radius:999px; font-size:12px; opacity:.9;
        }

        .grid{
            display:grid;
            grid-template-columns: 1.1fr .9fr 1fr;
            gap:12px;
        }
        @media (max-width:820px){
            .grid{grid-template-columns:1fr}
        }

        .panel{
            border:1px solid #2a385b;
            background:#0d1527;
            border-radius:16px;
            padding:14px;
            display:grid; gap:10px;
            min-height:140px;
        }
        label span{display:block; font-size:12px; opacity:.75; margin-bottom:6px}
        input, select{
            width:100%;
            padding:12px;
            border-radius:12px;
            border:1px solid #2a385b;
            background:#0b1220;
            color:#e9eefc;
            outline:none;
        }
        input:focus, select:focus{border-color:#4d7cff}

        .stats{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:10px;
        }
        .stat{
            border:1px solid #2a385b;
            background:#0b1220;
            border-radius:14px;
            padding:12px;
        }
        .stat .k{font-size:12px; opacity:.7}
        .stat .v{font-size:22px; font-weight:900; margin-top:4px}
        .muted{opacity:.8; font-size:13px}

        .progress{
            height:12px;
            border:1px solid #2a385b;
            background:#0b1220;
            border-radius:999px;
            overflow:hidden;
        }
        .bar{
            height:100%;
            width:0%;
            background:#4d7cff;
            transition: width .2s linear;
        }

        .actions{
            display:flex; gap:10px; flex-wrap:wrap;
        }
        button{
            padding:12px 12px;
            border-radius:12px;
            border:1px solid #2a385b;
            background:#121c33;
            color:#e9eefc;
            cursor:pointer;
            min-width:110px;
        }
        button:disabled{opacity:.5; cursor:not-allowed}
        .primary{background:#4d7cff; border-color:#4d7cff; color:#081022; font-weight:900}
        .danger{background:#ff4d6d; border-color:#ff4d6d; color:#14050a; font-weight:900}

        .log{
            max-height:240px; overflow:auto;
            border:1px solid #2a385b;
            background:#0b1220;
            border-radius:14px;
            padding:10px;
            font-size:13px;
        }
        .logItem{
            padding:10px;
            border-bottom:1px solid rgba(42,56,91,.55);
            display:flex;
            justify-content:space-between;
            gap:10px;
        }
        .logItem:last-child{border-bottom:none}
        code{background:rgba(255,255,255,.06); padding:2px 6px; border-radius:8px}
    </style>
</head>
<body>

<main class="card">
    <header>
        <div>
            <h1>Smart Habit Tracker ⏳</h1>
            <p class="sub">setInterval structure: <code>state</code> → <code>render()</code> → <code>start/pause/reset</code></p>
        </div>
        <div id="modeBadge" class="badge">Status: Ready</div>
    </header>

    <section class="grid">
        <!-- Controls -->
        <div class="panel">
            <label>
                <span>Habit title</span>
                <input id="habitInput" type="text" placeholder="e.g. JS Practice" value="JS Practice"/>
            </label>

            <label>
                <span>Tick frequency (seconds)</span>
                <select id="freqSelect">
                    <option value="5">Every 5 sec</option>
                    <option value="10" selected>Every 10 sec</option>
                    <option value="15">Every 15 sec</option>
                </select>
            </label>

            <div class="actions">
                <button id="startBtn" class="primary">Start</button>
                <button id="pauseBtn" disabled>Pause</button>
                <button id="resetBtn" class="danger" disabled>Reset</button>
            </div>

            <div class="muted">
                Հուշում․ interval-ը պահիր `timerId`-ում, Stop-ի ժամանակ `clearInterval(timerId)`։
            </div>
        </div>

        <!-- Stats -->
        <div class="panel">
            <div class="stats">
                <div class="stat">
                    <div class="k">Streak</div>
                    <div id="streakText" class="v">0</div>
                </div>
                <div class="stat">
                    <div class="k">Next tick in</div>
                    <div id="nextTickText" class="v">10s</div>
                </div>
            </div>

            <div>
                <div class="muted" style="margin-bottom:8px;">Progress to next tick</div>
                <div class="progress"><div id="progressBar" class="bar"></div></div>
            </div>

            <div class="muted">
                Logic: ամեն tick-ին streak++ և log ավելացնել։
            </div>
        </div>

        <!-- History -->
        <div class="panel">
            <div class="muted" style="display:flex; justify-content:space-between; align-items:center;">
                <span>History (last 20)</span>
                <span id="historyCount">0</span>
            </div>
            <div id="logBox" class="log"></div>
        </div>
    </section>
</main>

<script>
    const $=t=>document.querySelector(t),ui={habitInput:$("#habitInput"),freqSelect:$("#freqSelect"),modeBadge:$("#modeBadge"),streakText:$("#streakText"),nextTickText:$("#nextTickText"),progressBar:$("#progressBar"),logBox:$("#logBox"),historyCount:$("#historyCount"),startBtn:$("#startBtn"),pauseBtn:$("#pauseBtn"),resetBtn:$("#resetBtn")};let timerId=null;const state={habit:ui.habitInput.value.trim()||"Habit",freqSec:Number(ui.freqSelect.value),isRunning:!1,streak:0,msUntilTick:1e3*Number(ui.freqSelect.value),msTotalTick:1e3*Number(ui.freqSelect.value),history:[]};function nowTime(){const t=new Date;return`${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}:${String(t.getSeconds()).padStart(2,"0")}`}function clamp(t,e,s){return Math.min(s,Math.max(e,t))}function pushHistory(t){state.history.unshift({t:nowTime(),msg:t}),state.history=state.history.slice(0,20)}function render(){ui.modeBadge.textContent="Status: "+(state.isRunning?"Running":"Ready"),ui.streakText.textContent=String(state.streak);const t=Math.ceil(state.msUntilTick/1e3);ui.nextTickText.textContent=`${t}s`;const e=(state.msTotalTick-state.msUntilTick)/state.msTotalTick*100;ui.progressBar.style.width=`${clamp(e,0,100)}%`,ui.historyCount.textContent=`${state.history.length}`,ui.logBox.innerHTML=state.history.length?state.history.map((t=>`\n          <div class="logItem">\n            <span>${t.msg}</span>\n            <span style="opacity:.7">${t.t}</span>\n          </div>\n        `)).join(""):'<div class="muted">No history yet. Press Start.</div>',ui.startBtn.disabled=state.isRunning,ui.pauseBtn.disabled=!state.isRunning,ui.resetBtn.disabled=!1===state.isRunning&&0===state.streak&&0===state.history.length,ui.habitInput.disabled=state.isRunning,ui.freqSelect.disabled=state.isRunning}function stopInterval(){null!==timerId&&(clearInterval(timerId),timerId=null)}function tick(){state.msUntilTick-=100,state.msUntilTick<=0&&(state.streak++,pushHistory(`✅ ${state.habit} — streak is now ${state.streak}`),state.msUntilTick=state.msTotalTick),render()}function syncFromInputs(){state.habit=ui.habitInput.value.trim()||"Habit",state.freqSec=Number(ui.freqSelect.value),state.msTotalTick=1e3*state.freqSec,state.msUntilTick=state.msTotalTick}function start(){state.isRunning||(syncFromInputs(),state.isRunning=!0,pushHistory(`▶️ Started: "${state.habit}" every ${state.freqSec}s`),stopInterval(),timerId=setInterval(tick,100),render())}function pause(){state.isRunning&&(state.isRunning=!1,stopInterval(),pushHistory(`⏸️ Paused at streak ${state.streak}`),render())}function reset(){pause(),syncFromInputs(),state.streak=0,state.history=[],pushHistory("🔄 Reset done"),render()}ui.startBtn.addEventListener("click",start),ui.pauseBtn.addEventListener("click",pause),ui.resetBtn.addEventListener("click",reset),ui.habitInput.addEventListener("input",(()=>{state.isRunning||(state.habit=ui.habitInput.value.trim()||"Habit",render())})),ui.freqSelect.addEventListener("change",(()=>{state.isRunning||(state.freqSec=Number(ui.freqSelect.value),state.msTotalTick=1e3*state.freqSec,state.msUntilTick=state.msTotalTick,render())})),render();
</script>

</body>
</html>
