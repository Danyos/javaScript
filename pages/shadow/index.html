<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box Playground • PRO DRY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: linear-gradient(135deg,#111827 0%, #1f2937 50%, #0ea5e9 100%);
            --panel:#0b1220;--card:#0f172a;--text:#e5e7eb;--muted:#9ca3af;--accent:#22d3ee;
            --box-bg:#111827aa;--radius:16px;
        }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;background:#0b1020;color:var(--text);font-family:Inter,system-ui,Roboto,Arial,sans-serif}
        .app{max-width:1400px;margin:0 auto;min-height:100dvh;padding:24px;display:grid;gap:24px;grid-template-columns:280px 1fr 340px}
        .header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
        .title{font-size:22px;font-weight:800}
        .pill{font-size:12px;padding:8px 12px;border-radius:999px;border:1px solid #ffffff1f;background:#ffffff0a;color:var(--muted)}
        .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .actions select{background:#ffffff0a;color:#e5e7eb;border:1px solid #ffffff1f;border-radius:8px;padding:6px 8px}
        .btn{background:#0ea5e9;color:#06121f;border:none;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
        .btn:active{transform:translateY(1px)}
        .btn.secondary{background:#ffffff12;color:#e5e7eb;border:1px solid #ffffff24}
        .panel{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px #00000059,inset 0 0 0 1px #ffffff0a;max-height:90vh;overflow:auto}
        .canvas{background:var(--panel);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px #00000059,inset 0 0 0 1px #ffffff0a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
        .cover-bg{position:absolute;inset:10px;border-radius:calc(var(--radius) - 8px);background:var(--bg)}
        .box{position:relative;width:300px;height:200px;border-radius:18px;background:var(--box-bg);border:3px solid #4dd4f7;box-shadow:0 20px 60px #00000073;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;transition:all .25s ease;text-transform:none;text-decoration:none;text-align:center;padding:12px 16px;line-height:1.2}
        h2{margin:10px 0;font-size:18px;font-weight:800}
        .field{display:grid;gap:8px;margin-bottom:14px}
        .row{display:grid;grid-template-columns:1fr 100px;gap:10px}
        label{font-size:13px;color:var(--muted)}
        input[type="color"],input[type="range"],input[type="number"],input[type="text"],select{width:100%;border:1px solid #ffffff14;background:#ffffff08;color:var(--text);border-radius:10px;padding:8px}
        input[type="color"]{height:44px;padding:0}
        input[type="range"]{height:32px;accent-color:var(--accent);background:transparent}
        .sep{height:1px;background:#ffffff10;margin:14px 0}
        .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        @media(max-width:1100px){.app{grid-template-columns:1fr}.panel{order:-1}}
    </style>
</head>
<body>
<main class="app">
    <div class="header">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="title">Box Playground • PRO DRY</div>
            <div class="pill">HTML + CSS + JS</div>
        </div>
        <div class="actions">
            <select id="presetSelect" title="Presets">
                <option value="">Presets</option>
                <option value="softCard">Soft Card</option>
                <option value="glass">Glass</option>
                <option value="elevated">Elevated</option>
                <option value="warning">Warning</option>
                <option value="success">Success</option>
            </select>
            <button id="saveBtn" class="btn secondary" title="Save to browser">Save</button>
            <button id="loadBtn" class="btn secondary" title="Load from browser">Load</button>
            <button id="resetBtn" class="btn secondary">Reset</button>
            <button id="copyBtn" class="btn">Copy CSS</button>
        </div>
    </div>

    <!-- LEFT PANEL: Content + Text + Text Layout + Transform + Transition -->
    <aside class="panel" id="left">
        <h2>Content</h2>
        <div class="field">
            <label>Box Text</label>
            <input type="text" placeholder="Write something…" value="Preview Box"
                   data-bind data-target="#box" data-prop="textContent">
        </div>
        <div class="sep"></div>

        <h2>Text Style</h2>
        <div class="field">
            <label>Text Color</label>
            <input type="color" value="#ffffff" data-bind data-target="#box" data-prop="color">
        </div>
        <div class="field">
            <label>Font Size (px)</label>
            <div class="row">
                <input id="fontSize" type="range" min="10" max="64" value="20" data-bind data-target="#box" data-prop="fontSize" data-unit="px" data-sync="#fontSizeNum">
                <input id="fontSizeNum" type="number" value="20" data-bind data-target="#box" data-prop="fontSize" data-unit="px" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Font Weight</label>
            <input type="number" min="100" max="900" step="100" value="600" data-bind data-target="#box" data-prop="fontWeight">
        </div>
        <div class="field">
            <label>Text Transform</label>
            <select data-bind data-target="#box" data-prop="textTransform">
                <option value="none">None</option>
                <option value="uppercase">Uppercase</option>
                <option value="lowercase">Lowercase</option>
                <option value="capitalize">Capitalize</option>
            </select>
        </div>
        <div class="field">
            <label>Text Decoration</label>
            <select data-bind data-target="#box" data-prop="textDecoration">
                <option value="none">None</option>
                <option value="underline">Underline</option>
                <option value="overline">Overline</option>
                <option value="line-through">Line Through</option>
            </select>
        </div>

        <div class="sep"></div>

        <h2>Text Layout</h2>
        <div class="field">
            <label>Text Align</label>
            <select data-bind data-target="#box" data-prop="textAlign">
                <option value="center">Center</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="justify">Justify</option>
            </select>
        </div>

        <div class="field">
            <label>Letter Spacing (px)</label>
            <div class="row">
                <input id="ls" type="range" min="-2" max="8" step="0.5" value="0"
                       data-bind data-target="#box" data-prop="letterSpacing" data-unit="px" data-sync="#lsNum">
                <input id="lsNum" type="number" step="0.5" value="0"
                       data-bind data-target="#box" data-prop="letterSpacing" data-unit="px" data-sync-prev>
            </div>
        </div>

        <div class="field">
            <label>Line Height</label>
            <div class="row">
                <input id="lh" type="range" min="0.8" max="2" step="0.05" value="1.2"
                       data-bind data-target="#box" data-prop="lineHeight" data-sync="#lhNum">
                <input id="lhNum" type="number" step="0.05" value="1.2"
                       data-bind data-target="#box" data-prop="lineHeight" data-sync-prev>
            </div>
        </div>

        <div class="field">
            <label>Padding X (px)</label>
            <div class="row">
                <input id="px" type="range" min="0" max="64" value="16"
                       data-bind data-target="#box" data-prop="paddingInline" data-unit="px" data-sync="#pxNum">
                <input id="pxNum" type="number" value="16"
                       data-bind data-target="#box" data-prop="paddingInline" data-unit="px" data-sync-prev>
            </div>
        </div>

        <div class="field">
            <label>Padding Y (px)</label>
            <div class="row">
                <input id="py" type="range" min="0" max="64" value="12"
                       data-bind data-target="#box" data-prop="paddingBlock" data-unit="px" data-sync="#pyNum">
                <input id="pyNum" type="number" value="12"
                       data-bind data-target="#box" data-prop="paddingBlock" data-unit="px" data-sync-prev>
            </div>
        </div>

        <div class="sep"></div>

        <h2>Transform</h2>
        <div class="field">
            <label>Rotate (deg)</label>
            <div class="row">
                <input id="rotate" type="range" min="-180" max="180" value="0" data-transform="rotate" data-sync="#rotateNum">
                <input id="rotateNum" type="number" value="0" data-transform="rotate" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Scale</label>
            <div class="row">
                <input id="scale" type="range" min="0.5" max="2" step="0.1" value="1" data-transform="scale" data-sync="#scaleNum">
                <input id="scaleNum" type="number" step="0.1" value="1" data-transform="scale" data-sync-prev>
            </div>
        </div>

        <div class="sep"></div>

        <h2>Transition</h2>
        <div class="field">
            <label>Duration (s)</label>
            <input type="number" value="0.25" step="0.05" data-bind data-target="#box" data-prop="transition" data-format="all {v}s ease">
        </div>
    </aside>

    <!-- CENTER -->
    <section class="canvas">
        <div class="cover-bg"></div>
        <div class="box" id="box">Preview Box</div>
    </section>

    <!-- RIGHT PANEL: Background + Size/Border + Shadow + Bottom Line -->
    <aside class="panel" id="right">
        <h2>Background</h2>
        <div class="field">
            <label>Cover background</label>
            <input type="color" value="#0ea5e9" data-bind data-target=".cover-bg" data-prop="background">
        </div>
        <div class="field">
            <label>Box background</label>
            <input type="color" value="#111827" data-bind data-target="#box" data-prop="background">
        </div>

        <div class="sep"></div>

        <h2>Box Size & Border</h2>
        <div class="field">
            <label>Width (px)</label>
            <div class="row">
                <input type="range" min="100" max="600" value="300" data-bind data-target="#box" data-prop="width" data-unit="px" data-sync="#wNum">
                <input id="wNum" type="number" value="300" data-bind data-target="#box" data-prop="width" data-unit="px" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Height (px)</label>
            <div class="row">
                <input type="range" min="100" max="400" value="200" data-bind data-target="#box" data-prop="height" data-unit="px" data-sync="#hNum">
                <input id="hNum" type="number" value="200" data-bind data-target="#box" data-prop="height" data-unit="px" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Border width (px)</label>
            <div class="row">
                <input type="range" min="0" max="20" value="3" data-bind data-target="#box" data-prop="borderWidth" data-unit="px" data-sync="#bwNum">
                <input id="bwNum" type="number" value="3" data-bind data-target="#box" data-prop="borderWidth" data-unit="px" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Border color</label>
            <input type="color" value="#4dd4f7" data-bind data-target="#box" data-prop="borderColor">
        </div>
        <div class="field">
            <label>Border radius (px)</label>
            <div class="row">
                <input type="range" min="0" max="60" value="18" data-bind data-target="#box" data-prop="borderRadius" data-unit="px" data-sync="#brNum">
                <input id="brNum" type="number" value="18" data-bind data-target="#box" data-prop="borderRadius" data-unit="px" data-sync-prev>
            </div>
        </div>

        <div class="sep"></div>

        <h2>Box Shadow</h2>
        <div class="field">
            <label>Color</label>
            <input type="color" value="#000000" data-shadow="color">
        </div>
        <div class="field">
            <label>Offset X</label>
            <div class="row">
                <input type="range" min="-100" max="100" value="0" data-shadow="x" data-sync="#sxNum">
                <input id="sxNum" type="number" value="0" data-shadow="x" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Offset Y</label>
            <div class="row">
                <input type="range" min="-100" max="100" value="20" data-shadow="y" data-sync="#syNum">
                <input id="syNum" type="number" value="20" data-shadow="y" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Blur</label>
            <div class="row">
                <input type="range" min="0" max="100" value="60" data-shadow="blur" data-sync="#sbNum">
                <input id="sbNum" type="number" value="60" data-shadow="blur" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Spread</label>
            <div class="row">
                <input type="range" min="-50" max="50" value="0" data-shadow="spread" data-sync="#ssNum">
                <input id="ssNum" type="number" value="0" data-shadow="spread" data-sync-prev>
            </div>
        </div>

        <div class="sep"></div>

        <h2>Bottom Line</h2>
        <div class="field inline">
            <input id="blEnabled" type="checkbox" />
            <label for="blEnabled">Enable Bottom Line (override other borders)</label>
        </div>
        <div class="field">
            <label>Style</label>
            <select data-bottom="style">
                <option value="none">None</option>
                <option value="solid" selected>Solid</option>
                <option value="dashed">Dashed</option>
                <option value="dotted">Dotted</option>
                <option value="double">Double</option>
            </select>
        </div>
        <div class="field">
            <label>Width (px)</label>
            <div class="row">
                <input id="blw" type="range" min="0" max="20" value="2" data-bottom="width" data-sync="#blwNum">
                <input id="blwNum" type="number" value="2" data-bottom="width" data-sync-prev>
            </div>
        </div>
        <div class="field">
            <label>Color</label>
            <input type="color" value="#4dd4f7" data-bottom="color">
        </div>
    </aside>
</main>
