<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List — Neo Brutal UI</title>

    <style>
        :root{
            --bg: #fff3d6;
            --ink:#111827;

            --paper:#ffffff;
            --paper2:#fff7ff;

            --line:#111827;

            --accent:#7c3aed;   /* purple */
            --accent2:#06b6d4;  /* cyan */
            --warn:#f59e0b;     /* amber */
            --ok:#22c55e;       /* green */
            --bad:#ef4444;      /* red */

            --shadow: 6px 6px 0 rgba(17,24,39,.95);
            --radius: 18px;
        }

        *{ box-sizing:border-box; }
        html,body{ height:100%; }
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            color: var(--ink);
            background:
                    radial-gradient(900px 500px at 10% 0%, rgba(124,58,237,.18), transparent 60%),
                    radial-gradient(800px 520px at 110% 15%, rgba(6,182,212,.18), transparent 60%),
                    var(--bg);
        }

        .wrap{
            max-width: 1040px;
            margin: clamp(16px, 4vh, 52px) auto;
            padding: 0 16px;
            display:grid;
            gap: 16px;
        }

        /* BIG TOP CARD */
        .board{
            background: linear-gradient(135deg, var(--paper), var(--paper2));
            border: 3px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow:hidden;
        }

        .head{
            padding: 18px 18px 12px;
            display:flex;
            align-items:flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 3px solid var(--line);
            background: #ffffffcc;
        }

        .title{
            margin:0;
            font-weight: 1000;
            letter-spacing: .3px;
            font-size: 1.8rem;
            line-height: 1.05;
        }
        .sub{
            margin: 6px 0 0;
            font-weight: 700;
            color: rgba(17,24,39,.72);
        }

        /* Search */
        .search{
            width: 100%;
            max-width: 360px;
            min-width: 220px;
            display:flex;
            flex-direction: column;
            gap: 6px;
        }
        .label{
            font-size: .85rem;
            font-weight: 900;
            letter-spacing: .2px;
            text-transform: uppercase;
        }

        .control, .select{
            width: 100%;
            padding: .75rem .85rem;
            border-radius: 14px;
            border: 3px solid var(--line);
            outline: none;
            background: #fff;
            color: var(--ink);
            font-weight: 800;
            box-shadow: 4px 4px 0 rgba(17,24,39,.9);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .control:focus, .select:focus{
            transform: translate(-1px,-1px);
            box-shadow: 6px 6px 0 rgba(17,24,39,.92);
        }
        .control::placeholder{ color: rgba(17,24,39,.45); font-weight: 800; }

        /* TOOLBAR */
        .toolbar{
            padding: 14px 18px;
            display:flex;
            align-items:center;
            gap: 10px;
            flex-wrap: wrap;
            background: #ffffffb0;
        }

        .chip{
            border: 3px solid var(--line);
            border-radius: 999px;
            padding: .45rem .75rem;
            font-weight: 1000;
            cursor:pointer;
            user-select:none;
            display:inline-flex;
            gap: .55rem;
            align-items:center;
            background: #fff;
            box-shadow: 4px 4px 0 rgba(17,24,39,.92);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .chip:hover{
            transform: translate(-1px,-1px);
            box-shadow: 6px 6px 0 rgba(17,24,39,.92);
        }
        .chip.active{
            color:#fff;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
        }
        .chip .count{
            padding: .1rem .55rem;
            border-radius: 999px;
            background: rgba(17,24,39,.1);
            border: 2px solid rgba(17,24,39,.35);
            font-weight: 1000;
        }
        .chip.active .count{
            background: rgba(255,255,255,.22);
            border-color: rgba(255,255,255,.35);
            color:#fff;
        }

        .spacer{ flex:1; }

        .sortbox{
            display:flex;
            align-items:flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
        .sortbox .select{ width: 180px; }

        /* ADD FORM */
        .add{
            padding: 14px 18px 18px;
            border-top: 3px solid var(--line);
            background: #fff;
        }
        .grid{
            display:grid;
            grid-template-columns: 1fr 220px 160px;
            gap: 10px;
            align-items: end;
        }

        .btn{
            border: 3px solid var(--line);
            border-radius: 14px;
            padding: .78rem .9rem;
            font-weight: 1000;
            cursor:pointer;
            box-shadow: 4px 4px 0 rgba(17,24,39,.92);
            transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
            background: linear-gradient(135deg, var(--accent2), #67e8f9);
            color: #06202a;
        }
        .btn:hover{
            transform: translate(-1px,-1px);
            box-shadow: 6px 6px 0 rgba(17,24,39,.92);
            filter: brightness(1.02);
        }

        /* LIST */
        .listWrap{
            padding: 16px 18px 18px;
            background: #ffffffcc;
            border-top: 3px solid var(--line);
        }
        .list{
            list-style:none;
            margin:0;
            padding:0;
            display:flex;
            flex-direction: column;
            gap: 12px;
        }

        .item{
            background: #fff;
            border: 3px solid var(--line);
            border-radius: 16px;
            box-shadow: 5px 5px 0 rgba(17,24,39,.92);
            padding: 12px 12px;
            display:flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .item:hover{
            transform: translate(-1px,-1px);
            box-shadow: 7px 7px 0 rgba(17,24,39,.92);
        }

        .left{
            display:flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            min-width: 0;
        }

        .task{
            font-weight: 1000;
            letter-spacing: .2px;
            max-width: min(560px, 72vw);
            white-space: nowrap;
            overflow:hidden;
            text-overflow: ellipsis;
        }

        .badge{
            border: 3px solid var(--line);
            border-radius: 999px;
            padding: .25rem .6rem;
            font-weight: 1000;
            cursor:pointer;
            user-select:none;
            transition: transform .12s ease, filter .12s ease;
        }
        .badge:hover{ transform: translateY(-1px); filter: brightness(1.02); }

        .status-pending{ background: #e5e7eb; color:#111827; }
        .status-progress{ background: #fde68a; color:#111827; }
        .status-done{ background: #bbf7d0; color:#111827; }

        .actions{
            display:flex;
            gap: 10px;
            align-items:center;
        }

        .del{
            background: #fff;
            color: var(--bad);
            border: 3px solid var(--line);
            border-radius: 14px;
            padding: .6rem .75rem;
            font-weight: 1000;
            cursor:pointer;
            box-shadow: 4px 4px 0 rgba(17,24,39,.92);
            transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
        }
        .del:hover{
            transform: translate(-1px,-1px);
            box-shadow: 6px 6px 0 rgba(17,24,39,.92);
            filter: brightness(1.02);
            background: rgba(239,68,68,.08);
        }

        .hint{
            padding: 0 18px 18px;
            font-weight: 800;
            color: rgba(17,24,39,.75);
        }

        @media (max-width: 900px){
            .head{ flex-direction: column; }
            .search{ max-width: none; }
            .grid{ grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<main class="wrap">
    <section class="board" aria-label="Todo UI">

        <header class="head">
            <div>
                <h1 class="title">Todo List</h1>
                <p class="sub">Ավելացրու, ֆիլտրիր, սեղմիր ստատուսի վրա՝ փոխելու համար 😄</p>
            </div>

            <div class="search">
                <div class="label">Search</div>
                <input id="search" class="control" placeholder="Որոնել…" />
            </div>
        </header>

        <div class="toolbar" role="tablist" aria-label="Ֆիլտրեր">
            <button class="chip active" data-tab="All" role="tab" aria-selected="true">
                All <span class="count" id="cnt-all">0</span>
            </button>
            <button class="chip" data-tab="Pending" role="tab" aria-selected="false">
                Pending <span class="count" id="cnt-pending">0</span>
            </button>
            <button class="chip" data-tab="In Progress" role="tab" aria-selected="false">
                In Progress <span class="count" id="cnt-progress">0</span>
            </button>
            <button class="chip" data-tab="Completed" role="tab" aria-selected="false">
                Completed <span class="count" id="cnt-done">0</span>
            </button>

            <div class="spacer"></div>

            <div class="sortbox" aria-label="Դասավորել">
                <div style="min-width:160px">
                    <div class="label">Sort</div>
                    <select id="sort" class="select">
                        <option value="newest" selected>Newest</option>
                        <option value="status">By Status</option>
                        <option value="az">A → Z</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="add">
            <div class="grid">
                <div>
                    <div class="label">Task</div>
                    <input id="title" type="text" class="control" placeholder="Գրիր առաջադրանքը…" />
                </div>

                <div>
                    <div class="label">Status</div>
                    <select id="status" class="select">
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Completed</option>
                    </select>
                </div>

                <div>
                    <div class="label">&nbsp;</div>
                    <button id="add" class="btn">Ավելացնել</button>
                </div>
            </div>
        </div>

        <div class="listWrap">
            <ul id="list" class="list" aria-label="Առաջադրանքների ցուցակ"></ul>
        </div>

        <div class="hint">💥 Tip: ստատուսի badge-ը “click” արա՝ Pending → In Progress → Completed</div>

    </section>
</main>

<script>
    const STORAGE_KEY="todos-v1",STATUSES=["Pending","In Progress","Completed"];
    let items=load()||seed();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}
    function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))}catch{return null}}
    function seed(){
        const t=Date.now();
        return[
            {id:uid(),title:"asdfghjkl #1",status:"Pending",createdAt:t-36e5},
            {id:uid(),title:"qwertyuio #2",status:"In Progress",createdAt:t-18e5},
            {id:uid(),title:"zxcvbnm #3",status:"Completed",createdAt:t-3e5}
        ]
    }
    function uid(){return crypto.randomUUID&&crypto.randomUUID()||String(Date.now()+Math.random())}

    const $list=document.getElementById("list"),
        $title=document.getElementById("title"),
        $status=document.getElementById("status"),
        $add=document.getElementById("add"),
        $search=document.getElementById("search"),
        $sort=document.getElementById("sort"),
        $tabs=Array.from(document.querySelectorAll("[data-tab]")),
        $cntAll=document.getElementById("cnt-all"),
        $cntP=document.getElementById("cnt-pending"),
        $cntPr=document.getElementById("cnt-progress"),
        $cntD=document.getElementById("cnt-done");

    let activeTab="All",query="",sortBy="newest";

    function onAdd(){
        const t=$title.value.trim();
        if(!t) return;
        items.unshift({id:uid(),title:t,status:$status.value,createdAt:Date.now()});
        $title.value="";
        $status.value="Pending";
        save(); render();
    }

    function render(){
        const t=filteredAndSorted(items,{tab:activeTab,q:query,sort:sortBy});
        $list.innerHTML=t.map(renderItem).join("");

        const c={All:items.length,Pending:0,"In Progress":0,Completed:0};
        items.forEach(x=>c[x.status]++);
        $cntAll.textContent=c.All;
        $cntP.textContent=c.Pending;
        $cntPr.textContent=c["In Progress"];
        $cntD.textContent=c.Completed;
    }

    function renderItem(t){
        const cls = t.status==="Pending" ? "status-pending"
            : t.status==="In Progress" ? "status-progress"
                : "status-done";

        return `
      <li class="item" data-id="${t.id}">
        <div class="left">
          <span class="task">${escapeHtml(t.title)}</span>
          <span class="badge ${cls}" title="Change status">${t.status}</span>
        </div>
        <div class="actions">
          <button class="del btn-del" title="Delete">Delete</button>
        </div>
      </li>
    `;
    }

    function filteredAndSorted(t,{tab,q:n,sort:s}){
        let a=t.slice();
        if(n) a=a.filter(x=>x.title.toLowerCase().includes(n));
        if(tab && tab!=="All") a=a.filter(x=>x.status===tab);

        if(s==="newest") a.sort((x,y)=>y.createdAt-x.createdAt);
        else if(s==="status"){
            const idx=v=>STATUSES.indexOf(v);
            a.sort((x,y)=>idx(x.status)-idx(y.status) || (y.createdAt-x.createdAt));
        }else if(s==="az"){
            a.sort((x,y)=>x.title.localeCompare(y.title,undefined,{sensitivity:"base"}) || (y.createdAt-x.createdAt));
        }
        return a;
    }

    function escapeHtml(t){
        return t.replace(/[&<>"']/g,(c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])))
    }

    $add.addEventListener("click",onAdd);
    $title.addEventListener("keydown",(e)=>{ if(e.key==="Enter") onAdd(); });

    $search.addEventListener("input",(e)=>{
        query=e.target.value.trim().toLowerCase();
        render();
    });

    $sort.addEventListener("change",(e)=>{
        sortBy=e.target.value;
        render();
    });

    $tabs.forEach(btn=>{
        btn.addEventListener("click",()=>{
            $tabs.forEach(x=>x.classList.remove("active"));
            btn.classList.add("active");
            activeTab=btn.dataset.tab;
            render();
        });
    });

    $list.addEventListener("click",(e)=>{
        const li=e.target.closest("li[data-id]");
        if(!li) return;
        const id=li.dataset.id;

        if(e.target.matches(".btn-del")){
            items=items.filter(x=>x.id!==id);
            save(); render(); return;
        }

        if(e.target.matches(".badge")){
            const it=items.find(x=>x.id===id);
            if(!it) return;
            const next=(STATUSES.indexOf(it.status)+1)%STATUSES.length;
            it.status=STATUSES[next];
            save(); render();
        }
    });

    render();
</script>

</body>
</html>
