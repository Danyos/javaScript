<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            height: 100%;
            background-color: #f6f6f6;
        }
        .sidebar {
            width: 250px;
            background-color: #121212;
            color: white;
            padding: 20px;
            height: 100vh;
        }
        .project-link {
            background-color: #1e1e1e;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            color: white;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }
        .main {
            flex-grow: 1;
            padding: 40px;
        }
        .form-control, .form-control:focus {
            background-color: #e7e7e7;
            border: none;
            box-shadow: none;
        }
        .form-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-dark {
            background-color: #2c2c2c;
            border: none;
        }
        .project-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar">
        <h5>YOUR PROJECTS</h5>
        <button class="btn btn-outline-light btn-sm mb-3" onclick="showAddForm()">+ Add Project</button>
        <div id="projectList"></div>
    </div>

    <!-- Main content -->
    <div class="main">
        <!-- Add Project Form -->
        <div id="addProjectForm" style="display: none;">
            <form onsubmit="saveProject(event)">
                <label class="form-label">TITLE</label>
                <input type="text" id="title" class="form-control" placeholder="Project title" required>

                <label class="form-label mt-3">DESCRIPTION</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Project description" required></textarea>

                <label class="form-label mt-3">DUE DATE</label>
                <input type="text" id="dueDate" class="form-control" placeholder="dd.mm.yyyy" required>

                <div class="form-buttons">
                    <button type="button" class="btn btn-light" onclick="cancelAdd()">Cancel</button>
                    <button type="submit" class="btn btn-dark">Save</button>
                </div>
            </form>
        </div>

        <!-- Project Details -->
        <div id="projectDetails" style="display: none;"></div>

        <!-- Default Welcome -->
        <div id="defaultView" class="project-card">
            <h3>Welcome</h3>
            <p>Select a project or add a new one.</p>
        </div>
    </div>
</div>

<script>
    const projectList=document.getElementById("projectList"),addForm=document.getElementById("addProjectForm"),defaultView=document.getElementById("defaultView"),projectDetails=document.getElementById("projectDetails");let projects=[];function showAddForm(){addForm.style.display="block",defaultView.style.display="none",projectDetails.style.display="none"}function cancelAdd(){addForm.style.display="none",defaultView.style.display="block",document.getElementById("title").value="",document.getElementById("description").value="",document.getElementById("dueDate").value=""}function saveProject(e){e.preventDefault();const t=document.getElementById("title").value.trim(),n=document.getElementById("description").value.trim(),s=document.getElementById("dueDate").value.trim(),o={id:Date.now(),title:t,description:n,dueDate:s,tasks:[]};projects.push(o),renderProjectLink(o),showProjectDetails(o),cancelAdd()}function renderProjectLink(e){const t=document.createElement("div");t.className="project-link",t.innerText=e.title,t.onclick=()=>showProjectDetails(e),projectList.appendChild(t)}function showProjectDetails(e){addForm.style.display="none",defaultView.style.display="none",projectDetails.style.display="block",projectDetails.innerHTML=`\n      <div class="project-card">\n        <div class="d-flex justify-content-between align-items-center">\n          <h3>${e.title}</h3>\n          <button class="btn btn-sm btn-danger" onclick="deleteProject(${e.id})">Delete</button>\n        </div>\n        <p class="text-muted">${e.dueDate}</p>\n        <p>${e.description}</p>\n        <hr>\n        <h5>Tasks</h5>\n        <div class="input-group mb-3">\n          <input type="text" id="taskInput-${e.id}" class="form-control" placeholder="Add Task">\n          <button class="btn btn-outline-secondary" onclick="addTask(${e.id})">Add Task</button>\n        </div>\n        <ul id="taskList-${e.id}" class="list-group">\n          ${e.tasks.map((t=>`<li class="list-group-item d-flex justify-content-between">${t}<button class="btn btn-sm btn-link text-danger" onclick="removeTask(${e.id}, '${t}')">Clear</button></li>`)).join("")}\n        </ul>\n      </div>\n    `}function addTask(e){const t=projects.find((t=>t.id===e)),n=document.getElementById(`taskInput-${e}`).value.trim();n&&(t.tasks.push(n),showProjectDetails(t))}function removeTask(e,t){const n=projects.find((t=>t.id===e));n.tasks=n.tasks.filter((e=>e!==t)),showProjectDetails(n)}function deleteProject(e){projects=projects.filter((t=>t.id!==e)),projectList.innerHTML="",projects.forEach(renderProjectLink),projectDetails.style.display="none",defaultView.style.display="block"}
</script>

</body>
</html>
