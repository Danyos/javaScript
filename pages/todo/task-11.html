<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Users & Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6fb; font-family:system-ui,sans-serif; padding:30px; }
        .card { border-radius:14px; box-shadow:0 10px 25px rgba(0,0,0,.08); }
        .person { padding:10px 14px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
        .person:hover { background:#e9ecef; }
        .person.active { background:#0d6efd; color:#fff; }
        .pill { font-size:12px; padding:3px 10px; border-radius:999px; background:rgba(0,0,0,.08); }
        .person.active .pill { background:rgba(255,255,255,.25); color:#fff; }

        .task { padding:12px 14px; border-radius:12px; background:#f8f9fa; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .done { background:#d1e7dd; color:#0f5132; cursor:pointer; padding:6px 10px; border-radius:999px; font-size:12px; }
        .not_done { background:#f8d7da; color:#842029; cursor:pointer; padding:6px 10px; border-radius:999px; font-size:12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row g-4">

        <!-- PEOPLE -->
        <div class="col-md-3">
            <div class="card p-3">
                <h5 class="mb-3">👤 Users</h5>

                <!-- ADD USER -->
                <div class="input-group mb-3">
                    <input id="userInput" type="text" class="form-control" placeholder="New user name...">
                    <button id="addUserBtn" class="btn btn-dark">Add</button>
                </div>

                <div id="peopleList"></div>
            </div>
        </div>

        <!-- TASKS -->
        <div class="col-md-9">
            <div class="card p-3">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h5 class="m-0">📝 Tasks for <span id="activePerson">—</span></h5>
                    <small class="text-muted" id="countInfo">0 tasks</small>
                </div>

                <!-- ADD TASK -->
                <div class="input-group mb-3">
                    <input id="taskInput" type="text" class="form-control" placeholder="New task...">
                    <button class="btn btn-primary" id="addTaskBtn">Add</button>
                </div>

                <div id="tasksList"></div>
            </div>
        </div>

    </div>
</div>

<script>
    let people=["Levon","Karen","Gagik"];const tasks=[{person:"Levon",title:"Finish project report",status:"done"},{person:"Levon",title:"Send email",status:"not_done"},{person:"Karen",title:"Prepare slides",status:"done"},{person:"Gagik",title:"Fix bug",status:"not_done"}];let activePerson=people[0];const peopleList=document.getElementById("peopleList"),tasksList=document.getElementById("tasksList"),activePersonEl=document.getElementById("activePerson"),countInfo=document.getElementById("countInfo"),userInput=document.getElementById("userInput"),taskInput=document.getElementById("taskInput");function normalizeName(e){return e.trim().replace(/\s+/g," ")}function hasUser(e){const t=e.toLowerCase();return people.some((e=>e.toLowerCase()===t))}function renderPeople(){peopleList.innerHTML="",people.forEach((e=>{const t=tasks.filter((t=>t.person===e)).length,n=document.createElement("div");n.className="person mb-2 "+(e===activePerson?"active":""),n.innerHTML=`\n        <span class="fw-semibold">${e}</span>\n        <span class="pill">${t}</span>\n      `,n.onclick=()=>{activePerson=e,renderPeople(),renderTasks()},peopleList.appendChild(n)}))}function renderTasks(){if(tasksList.innerHTML="",!activePerson)return activePersonEl.textContent="—",void(countInfo.textContent="0 tasks");activePersonEl.textContent=activePerson;const e=tasks.filter((e=>e.person===activePerson));countInfo.textContent=`${e.length} tasks`,0!==e.length?e.forEach((e=>{const t=document.createElement("div");t.className="task";const n="done"===e.status?"done":"not_done",s="done"===e.status?"done":"not_done";t.innerHTML=`\n        <span>${e.title}</span>\n        <span class="${n}">${s}</span>\n      `,t.querySelector("span:last-child").onclick=t=>{t.stopPropagation(),e.status="done"===e.status?"not_done":"done",renderPeople(),renderTasks()},tasksList.appendChild(t)})):tasksList.innerHTML='<div class="text-muted">No tasks yet. Add one 👇</div>'}document.getElementById("addUserBtn").onclick=()=>{const e=normalizeName(userInput.value);e&&(hasUser(e)?alert("Այս user-ը արդեն կա 🙂"):(people.push(e),activePerson=e,userInput.value="",renderPeople(),renderTasks()))},document.getElementById("addTaskBtn").onclick=()=>{if(!activePerson)return;const e=taskInput.value.trim();e&&(tasks.push({person:activePerson,title:e,status:"not_done"}),taskInput.value="",renderPeople(),renderTasks())},userInput.addEventListener("keydown",(e=>{"Enter"===e.key&&document.getElementById("addUserBtn").click()})),taskInput.addEventListener("keydown",(e=>{"Enter"===e.key&&document.getElementById("addTaskBtn").click()})),renderPeople(),renderTasks();
</script>

</body>
</html>
