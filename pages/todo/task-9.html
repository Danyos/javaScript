<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Simple Team Tasks</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .page,body{min-height:100vh}:root{--bg1:#ffffff;--bg2:#0f1b3a;--card:rgba(255,255,255,.08);--brd:rgba(255,255,255,.14);--text:#eef2ff;--muted:rgba(250, 250, 250, 0.65);--accent:#7aa7ff}*{box-sizing:border-box}body{margin:0;color:var(--text);background:#fff}.glass{background:var(--card);border:1px solid var(--brd);border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.text-accent{color:var(--accent)}.people li{padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;justify-content:space-between}.people li:hover{background:rgba(255,255,255,.06)}.people li.active{background:rgba(122,167,255,.18);border-color:rgba(122,167,255,.35)}.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--brd);color:var(--muted)}.form-control-dark,.form-control-dark:active,.form-control-dark:focus,.form-select.form-control-dark{background:rgba(255,255,255,.06);border:1px solid var(--brd);color:var(--text)}.form-control-dark::placeholder{color:rgba(238,242,255,.45)}.form-select.form-control-dark option{color:#111}.task-item{padding:12px 14px;border-radius:14px;border:1px solid var(--brd);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.badge-status{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--brd);text-transform:uppercase;letter-spacing:.4px}.badge-done{background:rgba(0,255,170,.12);border-color:rgba(0,255,170,.28)}.badge-notdone{background:rgba(255,90,90,.12);border-color:rgba(255,90,90,.28)}.empty{padding:26px;border-radius:14px;border:1px dashed rgba(255,255,255,.2);color:rgba(238,242,255,.7);text-align:center}
    </style>
</head>
<body>

<div class="page">
    <div class="container py-4">

        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h4 class="mb-0">Team Tasks</h4>
                <div class="text-muted small">Select a person to view tasks</div>
            </div>

            <div class="d-flex gap-2">
                <button id="btnAll" class="btn btn-sm btn-outline-light">All</button>
                <button id="btnDone" class="btn btn-sm btn-outline-light">Done</button>
                <button id="btnNotDone" class="btn btn-sm btn-outline-light">Not done</button>
            </div>
        </div>

        <div class="row g-3">
            <!-- Left: People -->
            <div class="col-12 col-md-4 col-lg-3">
                <div class="card glass">
                    <div class="card-header border-0 pb-0">
                        <div class="fw-semibold">People</div>
                    </div>
                    <div class="card-body pt-3">
                        <ul id="peopleList" class="list-unstyled m-0 people"></ul>
                    </div>
                </div>
            </div>

            <!-- Right: Tasks -->
            <div class="col-12 col-md-8 col-lg-9">
                <div class="card glass">
                    <div class="card-header border-0 pb-0 d-flex align-items-center justify-content-between">
                        <div class="fw-semibold">
                            Tasks for: <span id="activePerson" class="text-accent">—</span>
                        </div>
                        <div id="countInfo" class="small text-muted">0 tasks</div>
                    </div>

                    <div class="card-body pt-3">
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-md-7">
                                <input id="searchInput" class="form-control form-control-dark" type="text" placeholder="Search task...">
                            </div>
                            <div class="col-12 col-md-5">
                                <select id="sortSelect" class="form-select form-control-dark">
                                    <option value="newest">Sort: newest</option>
                                    <option value="oldest">Sort: oldest</option>
                                    <option value="doneFirst">Sort: done first</option>
                                </select>
                            </div>
                        </div>

                        <div id="tasksWrap" class="tasks"></div>
                        <div id="emptyState" class="empty d-none">
                            No tasks found 😅
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const people=["Levon","Karen","Gagik"],tasks=[{id:1,person:"Levon",title:"Finish project report",status:"done",createdAt:1},{id:2,person:"Levon",title:"Send invoice to client",status:"not_done",createdAt:2},{id:3,person:"Karen",title:"Prepare presentation slides",status:"done",createdAt:3},{id:4,person:"Karen",title:"Fix navbar responsive issue",status:"not_done",createdAt:4},{id:5,person:"Gagik",title:"Review pull requests",status:"done",createdAt:5},{id:6,person:"Gagik",title:"Update README documentation",status:"not_done",createdAt:6}];let activePerson=people[0],statusFilter="all";const peopleList=document.getElementById("peopleList"),tasksWrap=document.getElementById("tasksWrap"),activePersonEl=document.getElementById("activePerson"),countInfo=document.getElementById("countInfo"),emptyState=document.getElementById("emptyState"),btnAll=document.getElementById("btnAll"),btnDone=document.getElementById("btnDone"),btnNotDone=document.getElementById("btnNotDone"),searchInput=document.getElementById("searchInput"),sortSelect=document.getElementById("sortSelect");function renderPeople(){peopleList.innerHTML="",people.forEach((e=>{const t=document.createElement("li");t.className=e===activePerson?"active":"";const n=tasks.filter((t=>t.person===e)).length;t.innerHTML=`\n      <span class="fw-semibold">${e}</span>\n      <span class="pill">${n}</span>\n    `,t.addEventListener("click",(()=>{activePerson=e,renderPeople(),renderTasks()})),peopleList.appendChild(t)}))}function getFilteredTasks(){const e=searchInput.value.trim().toLowerCase();let t=tasks.filter((e=>e.person===activePerson));"all"!==statusFilter&&(t=t.filter((e=>e.status===statusFilter))),e&&(t=t.filter((t=>t.title.toLowerCase().includes(e))));const n=sortSelect.value;return"newest"===n?t.sort(((e,t)=>t.createdAt-e.createdAt)):"oldest"===n?t.sort(((e,t)=>e.createdAt-t.createdAt)):"doneFirst"===n&&t.sort(((e,t)=>("done"===e.status?-1:1)-("done"===t.status?-1:1))),t}function renderTasks(){activePersonEl.textContent=activePerson,tasksWrap.innerHTML="";const e=getFilteredTasks();countInfo.textContent=`${e.length} task${1===e.length?"":"s"}`,0!==e.length?(emptyState.classList.add("d-none"),e.forEach((e=>{const t=document.createElement("div");t.className="task-item";const n="done"===e.status?"badge-done":"badge-notdone",s="done"===e.status?"DONE":"NOT DONE";t.innerHTML=`\n      <div class="fw-semibold">${e.title}</div>\n      <span class="badge-status ${n}">${s}</span>\n    `,tasksWrap.appendChild(t)}))):emptyState.classList.remove("d-none")}function setStatusFilter(e){statusFilter=e,renderTasks()}btnAll.addEventListener("click",(()=>setStatusFilter("all"))),btnDone.addEventListener("click",(()=>setStatusFilter("done"))),btnNotDone.addEventListener("click",(()=>setStatusFilter("not_done"))),searchInput.addEventListener("input",renderTasks),sortSelect.addEventListener("change",renderTasks),renderPeople(),renderTasks();

</script>
</body>
</html>
