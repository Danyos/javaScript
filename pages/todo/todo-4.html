<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List — Fully Functional</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #0ea5e9 0, #1f2937 40%, #020617 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-wrap {
            padding: 40px 15px;
        }

        .glass-card {
            max-width: 1150px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.88);
            border-radius: 24px;
            padding: 28px 26px 26px;
            box-shadow:
                    0 20px 45px rgba(15, 23, 42, 0.8),
                    0 0 0 1px rgba(148, 163, 184, 0.15);
            backdrop-filter: blur(18px);
            color: #e5e7eb;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #f9fafb;
        }

        .sub {
            font-size: 0.9rem;
            color: #9ca3af;
            margin: 0;
        }

        .search-wrap {
            min-width: 220px;
            width: 260px;
        }

        .search {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.5);
            color: #e5e7eb;
        }

        .search::placeholder {
            color: #6b7280;
        }

        .search:focus {
            box-shadow: 0 0 0 1px #38bdf8, 0 0 0 4px rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .tab {
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            padding: 6px 14px;
            font-size: 0.82rem;
            background: rgba(15, 23, 42, 0.5);
            color: #e5e7eb;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .tab:hover {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
        }

        .tab.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-color: transparent;
            color: #f9fafb;
            box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.6), 0 10px 22px rgba(22, 163, 74, 0.4);
        }

        .tab-badge {
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 0.7rem;
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
        }

        .tab.active .tab-badge {
            background: rgba(15, 23, 42, 0.92);
            color: #bbf7d0;
        }

        .tabs-spacer {
            flex: 1;
        }

        .sort-label {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-right: 6px;
        }

        .sort-select {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.6);
            color: #e5e7eb;
        }

        .sort-select:focus {
            box-shadow: 0 0 0 1px #38bdf8, 0 0 0 4px rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
        }

        .divider {
            border-bottom: 1px dashed rgba(148, 163, 184, 0.45);
            margin-bottom: 18px;
        }

        .form-zone .form-control,
        .form-zone .form-select {
            background-color: rgba(15, 23, 42, 0.93);
            border-color: rgba(148, 163, 184, 0.6);
            color: #e5e7eb;
        }

        .form-zone .form-control::placeholder {
            color: #6b7280;
        }

        .form-zone .form-control:focus,
        .form-zone .form-select:focus {
            box-shadow: 0 0 0 1px #22c55e, 0 0 0 4px rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }

        .btn-add {
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #f9fafb;
            box-shadow: 0 12px 30px rgba(22, 163, 74, 0.55);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
        }

        .btn-add:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 16px 36px rgba(22, 163, 74, 0.6);
        }

        .btn-add:active {
            transform: translateY(0);
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.45);
        }

        .list-holder {
            margin-top: 18px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .list-group-item {
            background-color: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(31, 41, 55, 0.9);
            border-radius: 14px !important;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .list-group-item .task-text {
            color: #e5e7eb;
        }

        .status {
            font-size: 0.72rem;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .status-pending {
            background: rgba(250, 204, 21, 0.1);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.4);
        }

        .status-progress {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        .status-done {
            background: rgba(34, 197, 94, 0.14);
            color: #4ade80;
            border: 1px solid rgba(22, 163, 74, 0.6);
        }

        .btn-ghost {
            border-radius: 999px;
            font-size: 0.78rem;
            padding: 4px 10px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: transparent;
            color: #e5e7eb;
            transition: all 0.15s ease;
        }

        .btn-ghost:hover {
            border-color: #ef4444;
            background: rgba(248, 113, 113, 0.12);
            color: #fecaca;
        }

        /* Left sidebar: User list */
        .user-card {
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 55%),
            radial-gradient(circle at bottom, rgba(34, 197, 94, 0.16), transparent 58%),
            rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            padding: 16px 16px 14px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.85);
            height: 100%;
        }

        .user-card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-card h2 span.badge {
            font-size: 0.65rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .user-card small {
            color: #9ca3af;
            display: block;
            margin-bottom: 12px;
            font-size: 0.78rem;
        }

        .user-card .form-control {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.6);
            color: #e5e7eb;
        }

        .user-card .form-control::placeholder {
            color: #6b7280;
        }

        .user-card .form-control:focus {
            box-shadow: 0 0 0 1px #38bdf8, 0 0 0 4px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .btn-user-add {
            border-radius: 999px;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #f9fafb;
            box-shadow: 0 10px 26px rgba(14, 165, 233, 0.6);
            font-size: 1.2rem;
            padding-bottom: 3px;
        }

        .btn-user-add:hover {
            filter: brightness(1.05);
        }

        .user-list {
            list-style: none;
            padding-left: 0;
            margin-top: 14px;
            margin-bottom: 0;
            max-height: 260px;
            overflow-y: auto;
        }

        .user-list li {
            padding: 6px 8px;
            border-radius: 999px;
            font-size: 0.82rem;
            color: #e5e7eb;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .user-avatar {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #ecfccb;
            font-weight: 600;
        }

        .user-name {
            flex: 1;
            padding-left: 4px;
        }

        .user-tag {
            font-size: 0.68rem;
            color: #a5b4fc;
        }

        @media (max-width: 991.98px) {
            .glass-card {
                padding: 20px 18px;
            }
            .user-card {
                margin-bottom: 18px;
            }
        }
    </style>
</head>
<body>
<main class="app-wrap">
    <section class="glass-card" aria-label="Todo UI">
        <div class="row g-3">
            <!-- LEFT: Users -->
            <div class="col-lg-4">
                <div class="user-card">
                    <h2>
                        Օգտատերեր
                        <span class="badge text-bg-success">Team</span>
                    </h2>
                    <small>Ավելացրու ուսանողների/օգտատերերի անունները և ընտրիր, ում համար ես կառավարում առաջադրանքները։</small>

                    <div class="d-flex gap-2 mb-2">
                        <input
                                type="text"
                                class="form-control"
                                placeholder="Օր․՝ Artak, Gagik, Petros"
                                aria-label="User name"
                        />
                        <button class="btn-user-add" type="button" aria-label="Add user">+</button>
                    </div>

                    <ul class="user-list">
                        <li>
                            <div class="d-flex align-items-center gap-2">
                                <span class="user-avatar">A</span>
                                <span class="user-name">Artak</span>
                            </div>
                            <span class="user-tag">Active</span>
                        </li>
                        <li>
                            <div class="d-flex align-items-center gap-2">
                                <span class="user-avatar">G</span>
                                <span class="user-name">Gagik</span>
                            </div>
                            <span class="user-tag">Today</span>
                        </li>
                        <li>
                            <div class="d-flex align-items-center gap-2">
                                <span class="user-avatar">P</span>
                                <span class="user-name">Petros</span>
                            </div>
                            <span class="user-tag">Backlog</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- RIGHT: Todo app -->
            <div class="col-lg-8">
                <!-- Header -->
                <div class="app-header">
                    <div>
                        <h1 class="app-title mb-1">Todo List</h1>
                        <p class="sub">Կազմակերպիր օրդ․ ավելացրու, ֆիլտրիր, փոխիր առաջնահերթությունները 👇</p>
                    </div>

                    <!-- Search -->
                    <div class="search-wrap">
                        <input
                                id="search"
                                class="form-control search"
                                placeholder="Որոնել…"
                        />
                    </div>
                </div>

                <!-- Tabs & Sort -->
                <div class="tabs" role="tablist" aria-label="Ֆիլտրեր">
                    <button class="tab active" data-tab="all" role="tab" aria-selected="true">
                        All <span class="tab-badge" id="cnt-all">0</span>
                    </button>
                    <button class="tab" data-tab="pending" role="tab" aria-selected="false">
                        Pending <span class="tab-badge" id="cnt-pending">0</span>
                    </button>
                    <button class="tab" data-tab="inProgress" role="tab" aria-selected="false">
                        In Progress <span class="tab-badge" id="cnt-progress">0</span>
                    </button>
                    <button class="tab" data-tab="completed" role="tab" aria-selected="false">
                        Completed <span class="tab-badge" id="cnt-done">0</span>
                    </button>

                    <div class="tabs-spacer" aria-hidden="true"></div>

                    <div class="sort d-flex align-items-center">
                        <label class="sort-label" for="sort">Sort</label>
                        <select id="sort" class="form-select sort-select form-select-sm w-auto">
                            <option value="newest" selected>Newest</option>
                            <option value="status">By Status</option>
                            <option value="az">A → Z</option>
                        </select>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Add form -->
                <div class="form-zone mb-2">
                    <div class="row g-2 align-items-center">
                        <div class="col-md-7">
                            <input
                                    id="title"
                                    type="text"
                                    class="form-control"
                                    placeholder="Գրիր առաջադրանքը…"
                            />
                        </div>
                        <div class="col-md-3">
                            <select id="status" class="form-select">
                                <option value="pending">Pending</option>
                                <option value="inProgress">In Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button id="add" class="btn btn-add">
                                Ավելացնել
                            </button>
                        </div>
                    </div>
                </div>

                <!-- List -->
                <div class="list-holder">
                    <ul id="list" class="list-group" aria-label="Առաջադրանքների ցուցակ">
                        <!-- script.js կլցնի առաջադրանքները -->
                    </ul>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
